{id:"jobs",src:"td",t:"leader",
 fr:{title:"Le style de management de Steve Jobs",text:["Surnommé par ses équipes « chieur de première », Steve Jobs n'était pas connu pour être un patron sympathique. Selon l'une des premières gestionnaires de l'équipe Mac, il hurlait souvent en réunion quand quelque chose ne lui plaisait pas. Autoritaire, impatient et perfectionniste, il voulait tout contrôler : un salarié pouvait être renvoyé pour n'importe quel motif dès que la décision venait de lui.","Il imposait des délais souvent impossibles, vérifiait tout « mille fois » et tenait à être le dernier à valider chaque tâche, qu'il s'agisse de projets innovants ou de détails logistiques. Il ignorait souvent l'avis des actionnaires et des partenaires, ce qui lui a valu d'être renvoyé de sa propre entreprise en 1985.","Chez Apple régnait la « culture du oui » : il était déconseillé de ne pas approuver les décisions. Les salariés devaient aimer la marque, être disponibles presque 24h/24 et 7j/7 et ne rien dévoiler des projets. Une « Worldwide loyalty team » repérait le personnel jugé déviant, et les équipes travaillaient en vase clos, dans des pièces fermées. Ce management créait une pression constante, du stress et une grande fatigue, mais Apple a aussi lancé sous sa direction des produits qui ont transformé leur marché."]},
 ru:{title:"Стиль менеджмента Стива Джобса",text:["Сотрудники прозвали Стива Джобса «первоклассным занудой»: приятным начальником он не считался. По словам одной из первых менеджеров команды Mac, он часто кричал на совещаниях, если что-то ему не нравилось. Авторитарный, нетерпеливый и перфекционист, он хотел всё контролировать: сотрудника могли уволить по любому поводу, если так решил он сам.","Он ставил часто невыполнимые сроки, проверял всё «тысячу раз» и обязательно последним утверждал каждую задачу — от инновационных проектов до логистических мелочей. Он часто игнорировал мнение акционеров и партнёров, из-за чего в 1985 году его уволили из собственной компании.","В Apple царила «культура да»: не соглашаться с решениями не рекомендовалось. Сотрудники должны были любить бренд, быть доступными почти 24/7 и ничего не рассказывать о проектах. «Worldwide loyalty team» выявляла «неблагонадёжных», а команды работали в изоляции, в закрытых комнатах. Такой менеджмент создавал постоянное давление, стресс и сильную усталость, но при нём Apple выпустила продукты, изменившие целые рынки."]},
 q:[
 {t:"leader",fr:"Comment qualifiez-vous le style de management de Steve Jobs ?",ru:"Как вы охарактеризуете стиль менеджмента Стива Джобса?",
  pts:[["Style autoritaire / directif","Авторитарный / директивный стиль","autorit|directi|авторитар|директив"],["Centré sur le contrôle de tout","Упор на тотальный контроль","control|surveil|контрол|надзор"],["Décide seul, pas de désaccord possible","Решает сам, несогласие невозможно","seul |seul,|seul.|centralis|culture du oui|единолич|централиз|культура да|сам реш"],["Très exigeant, perfectionniste","Очень требовательный, перфекционист","perfection|exige|перфекц|требова"]],
  a:{fr:"Un style autoritaire (directif) : Jobs décide seul, impose ses délais, contrôle tout et n'accepte pas le désaccord (« culture du oui »). Le pouvoir est centralisé et repose sur la peur, mais aussi sur une exigence de qualité très forte (perfectionnisme).",ru:"Авторитарный (директивный) стиль: Джобс решает сам, навязывает сроки, всё контролирует и не терпит несогласия («культура да»). Власть централизована и держится на страхе, но и на очень высокой требовательности к качеству (перфекционизм)."}},
 {t:"leader",fr:"Quels sont les avantages et les inconvénients de ce style de management ?",ru:"Каковы плюсы и минусы такого стиля менеджмента?",
  pts:[["Avantage : qualité, innovation, vision claire","Плюс: качество, инновации, ясное видение","qualit|innov|vision|качеств|инновац|видени"],["Avantage : décisions rapides, cohérence, secret","Плюс: быстрые решения, единство, секретность","rapid|vite|coheren|secret|confidenti|быстр|единств|секрет|конфиденц"],["Inconvénient : stress, pression, fatigue","Минус: стресс, давление, усталость","stress|pression|fatigu|стресс|давлен|устал"],["Inconvénient : peur, démotivation, départs, créativité bridée","Минус: страх, демотивация, уходы, подавленная креативность","peur|demotiv|depart|turnover|creativ|страх|демотив|уход|текучест|креатив"]],
  a:{fr:"Avantages : une vision claire, une exigence de qualité qui favorise l'innovation, des décisions rapides et cohérentes, une grande confidentialité. Inconvénients : pression constante, stress et fatigue, peur des salariés, démotivation et départs, créativité bridée (personne n'ose contredire), conflits avec les actionnaires.",ru:"Плюсы: ясное видение, требовательность к качеству, которая двигает инновации, быстрые и последовательные решения, высокая конфиденциальность. Минусы: постоянное давление, стресс и усталость, страх сотрудников, демотивация и уходы, подавленная креативность (никто не смеет возразить), конфликты с акционерами."}},
 {t:"leader",fr:"Pour quelles raisons Steve Jobs avait-il adopté ce style de management ?",ru:"Почему Стив Джобс выбрал такой стиль менеджмента?",
  pts:[["Sa personnalité : impatient, perfectionniste","Его характер: нетерпеливый, перфекционист","personnal|caract|impatien|perfection|характер|личност|нетерп|перфекц"],["Sa vision produit et l'exigence d'excellence","Его видение продукта и стремление к совершенству","vision|excellen|qualit|produit|видени|совершен|качеств|продукт"],["Protéger le secret, éviter les fuites","Защитить секретность, избежать утечек","fuite|secret|confidenti|утечк|секрет|конфиденц|краж"],["Un marché très concurrentiel, besoin d'innover","Высокая конкуренция, нужно постоянно инновировать","concurren|march|innov|конкурен|рын|инновац"]],
  a:{fr:"D'abord sa personnalité (impatient, colérique, perfectionniste). Ensuite sa vision : il voulait des produits parfaits et gardait la main sur chaque détail. Le secret était vital face aux concurrents, d'où le travail en vase clos. Enfin, dans un marché très concurrentiel, il pensait que seul un contrôle total permettait d'innover vite.",ru:"Прежде всего характер (нетерпеливый, вспыльчивый, перфекционист). Затем видение: он хотел идеальные продукты и держал под контролем каждую деталь. Секретность была жизненно важна из-за конкурентов, отсюда работа в изоляции. Наконец, на очень конкурентном рынке он считал, что только полный контроль позволяет быстро инновировать."}},
 {t:"leader",fr:"Steve Jobs était-il un leader ou un simple manager ? Justifiez votre réponse.",ru:"Стив Джобс был лидером или просто менеджером? Обоснуйте ответ.",
  pts:[["Leader : vision, charisme, capacité à entraîner","Лидер: видение, харизма, умение вести за собой","leader|charism|vision|inspir|entrain|лидер|харизм|видени|вдохнов|вести"],["Manager : pouvoir hiérarchique, contrôle","Менеджер: иерархическая власть, контроль","manager|hierarch|pouvoir|statut|менеджер|иерарх|власт|должност"],["Limite : peu de confiance, renvoyé en 1985","Предел: мало доверия, уволен в 1985","1985|renvoy|confian|reconn|уволен|довери|признан"],["Conclusion nuancée : les deux à la fois","Взвешенный вывод: и то и другое","les deux|a la fois|aussi un|и то и другое|одновремен|оба"]],
  a:{fr:"Les deux. Leader par sa vision et son charisme : il entraînait les équipes vers un but commun et inspirait le marché. Mais il s'appuyait surtout sur son pouvoir hiérarchique et le contrôle, sans relation de confiance. Son leadership a donc été limité dans le temps : il a perdu la reconnaissance des actionnaires et a été renvoyé en 1985.",ru:"И то и другое. Лидер благодаря видению и харизме: он вёл команды к общей цели и вдохновлял рынок. Но опирался он прежде всего на иерархическую власть и контроль, без отношений доверия. Поэтому его лидерство было ограничено во времени: он потерял признание акционеров и был уволен в 1985."}},
 {t:"leader",fr:"Vous devez redresser un service en deux ans. Que retiendriez-vous des méthodes de Steve Jobs ?",ru:"Вам нужно за два года вывести отдел из кризиса. Что вы взяли бы из методов Джобса?",
  pts:[["Garder : objectifs clairs, vision, exigence","Взять: ясные цели, видение, требовательность","objectif|vision|exige|qualit|цел|видени|требова|качеств"],["Garder : suivi des résultats, contrôle","Взять: отслеживание результатов, контроль","control|suivi|indicat|resultat|контрол|отслеж|показател|результат"],["Rejeter : peur, humiliation ; garder le respect","Отказаться: страх, унижение; сохранить уважение","peur|humili|respect|страх|униж|уважен|крик"],["Associer les équipes, communiquer, motiver","Вовлекать команду, общаться, мотивировать","particip|associ|ecout|communi|motiv|вовлек|участ|слуша|общаться|общени|коммуник|мотив"]],
  a:{fr:"Je garderais la vision claire, des objectifs ambitieux, l'exigence de qualité et un suivi précis des résultats (indicateurs, contrôle). Je rejetterais la peur, les cris et l'humiliation : j'associerais les équipes aux décisions, je communiquerais et je motiverais, pour obtenir des résultats durables sans épuiser le personnel.",ru:"Я бы взяла ясное видение, амбициозные цели, требовательность к качеству и точный контроль результатов (показатели). Я бы отказалась от страха, криков и унижения: вовлекала бы команду в решения, общалась и мотивировала, чтобы получить устойчивые результаты, не выжигая людей."}}
 ]},
{id:"muller",src:"td",t:"cas",
 fr:{title:"Les Tôleries Muller-Schuster",text:["En 1933, Jean-Paul Muller est forgeron en Alsace. Son gendre, Richard Schuster, prend la direction en 1954 et oriente l'entreprise vers la tôlerie. Dans les années 1960, pour répondre à la forte demande, il absorbe deux concurrents. L'entreprise devient une société anonyme, dirigée par le fils, Tony Schuster. Elle réalise plus de 60 % de son chiffre d'affaires à l'étranger.","Mais le contexte change : les clients veulent des produits individualisés, en petites séries et avec des délais courts. Cinq clients importants partent en 2009. L'usine est vétuste et la productivité baisse : 1 € investi rapporte 5,90 € de production en 2009, contre 8,3 en 1998.","En 2010, Tony Schuster, désarmé face à la complexité et redoutant les décisions difficiles, confie la direction à un ingénieur recruté par un cabinet de consultants. Il garde la propriété du capital. Le nouveau dirigeant fixe des objectifs chiffrés (CA +5 %, productivité +3 %, résultat d'exploitation +5 %) et commande un audit : une pièce met un mois à être produite, la satisfaction client n'est que de 70 %. Il décide de supprimer des postes de chefs d'équipe et de rendre les ouvriers plus polyvalents."]},
 ru:{title:"Tôleries Muller-Schuster",text:["В 1933 году Жан-Поль Мюллер — кузнец в Эльзасе. Его зять Ришар Шустер возглавляет дело в 1954 году и переориентирует его на жестяное производство. В 1960-е, чтобы удовлетворить сильный спрос, он поглощает двух конкурентов. Компания становится АО, ею руководит сын — Тони Шустер. Более 60% оборота приходится на зарубежье.","Но условия меняются: клиенты хотят индивидуальные изделия, малыми сериями и в короткие сроки. В 2009 году уходят пять крупных клиентов. Завод устарел, производительность падает: 1 € инвестиций даёт 5,90 € продукции в 2009 году против 8,3 в 1998-м.","В 2010 году Тони Шустер, растерянный перед сложностью и боясь трудных решений, передаёт руководство инженеру, найденному через консалтинговое агентство. Капитал остаётся его собственностью. Новый руководитель ставит цели в цифрах (оборот +5%, производительность +3%, операционный результат +5%) и заказывает аудит: деталь производится месяц, удовлетворённость клиентов лишь 70%. Он решает сократить должности бригадиров и сделать рабочих более универсальными."]},
 q:[
 {t:"cas",fr:"Montrez que l'entreprise est passée d'une logique entrepreneuriale à une logique managériale.",ru:"Покажите, что компания перешла от предпринимательской логики к управленческой.",
  pts:[["Avant : la famille fondatrice possède et dirige","Раньше: семья-основатель владеет и управляет","fondat|famil|proprietaire dirig|gendre|fils|основат|семь|зять|сын"],["2010 : un dirigeant salarié, ingénieur recruté","2010: наёмный руководитель-инженер","ingenieur|recrut|salari|professionn|cabinet|инженер|наём|нанят|профессионал|агентств"],["Séparation de la propriété et du pouvoir","Разделение собственности и управления","separ|capital|propriet|раздел|капитал|собствен"],["Objectifs chiffrés, audit, indicateurs","Цели в цифрах, аудит, показатели","objectif|audit|chiffr|indicat|цел|аудит|цифр|показател"]],
  a:{fr:"Logique entrepreneuriale à l'origine : la famille fondatrice (Muller puis Schuster) possède le capital et dirige seule. En 2010, Tony Schuster garde le capital mais confie la direction à un ingénieur salarié : propriété et pouvoir sont séparés. Le nouveau dirigeant gère avec des outils managériaux : objectifs chiffrés communiqués à tous, audit, indicateurs.",ru:"Изначально предпринимательская логика: семья-основатель (Мюллер, затем Шустер) владеет капиталом и сама руководит. В 2010 году Тони Шустер сохраняет капитал, но передаёт управление наёмному инженеру: собственность и власть разделены. Новый руководитель использует управленческие инструменты: цели в цифрах для всех, аудит, показатели."}},
 {t:"cas",fr:"Quels sont les facteurs qui ont provoqué cette évolution ?",ru:"Какие факторы вызвали эту эволюцию?",
  pts:[["Croissance : taille, SA, complexité","Рост: размер, АО, сложность","croiss|taille|complex|societe anonyme|рост |роста|ростом|вырос|размер|сложн|акционерн"],["Marché : demande individualisée, petites séries, délais","Рынок: индивидуальный спрос, малые серии, сроки","demande|serie|delai|individual|спрос|сери|срок|индивидуал"],["Baisse de productivité, usine vétuste","Падение производительности, устаревший завод","productiv|vetust|obsolet|machine|производительн|устар|оборудован"],["Le dirigeant se sent désarmé","Руководитель чувствует себя растерянным","desarm|difficil|redout|растерян|трудн|бои"],["International, clients perdus","Зарубежные рынки, потерянные клиенты","etranger|international|export|clients|зарубеж|междунар|экспорт|клиент"]],
  a:{fr:"La croissance (absorptions, société anonyme, 60 % du CA à l'étranger) rend l'entreprise plus complexe. Le marché change : demande individualisée, petites séries, délais courts, cinq clients perdus en 2009. La productivité baisse et l'usine est vétuste. Enfin, le dirigeant familial se sent désarmé et redoute les décisions difficiles.",ru:"Рост (поглощения, АО, 60% оборота за рубежом) делает компанию сложнее. Рынок меняется: индивидуальный спрос, малые серии, короткие сроки, пять клиентов ушли в 2009. Производительность падает, завод устарел. Наконец, семейный руководитель растерян и боится трудных решений."}},
 {t:"cas",fr:"Proposez des indicateurs qui permettraient de mesurer la performance de l'entreprise.",ru:"Предложите показатели для измерения эффективности компании.",
  pts:[["Chiffre d'affaires, ventes","Оборот, продажи","chiffre d|vente|оборот|продаж|выручк"],["Productivité","Производительность","productiv|производительн"],["Délais de livraison, retards","Сроки поставки, задержки","delai|retard|livraison|срок|задерж|поставк"],["Satisfaction des clients","Удовлетворённость клиентов","satisfaction|удовлетвор"],["Coûts, résultat, rentabilité","Затраты, результат, рентабельность","couts|cout d|le cout|les cout|cout,|cout.|resultat|rentab|marge|затрат|издерж|прибыл|рентаб|результат"],["Social : absentéisme, turnover","Социальные: прогулы, текучесть","absente|rotation|turnover|прогул|текучест|отсутств"]],
  a:{fr:"Commerciaux : chiffre d'affaires, part à l'export, nombre de clients. Production : productivité (production par euro investi), délai de fabrication, retards de livraison. Clients : taux de satisfaction (70 % aujourd'hui). Financiers : coûts, résultat d'exploitation. Sociaux : absentéisme, turnover.",ru:"Коммерческие: оборот, доля экспорта, число клиентов. Производственные: производительность (продукция на 1 вложенный евро), срок изготовления, задержки поставок. Клиентские: удовлетворённость (сейчас 70%). Финансовые: затраты, операционный результат. Социальные: прогулы, текучесть."}},
 {t:"cas",fr:"Quels sont les avantages de la nouvelle organisation (moins de niveaux hiérarchiques, ouvriers polyvalents) ?",ru:"Каковы преимущества новой организации (меньше уровней иерархии, универсальные рабочие)?",
  pts:[["Plus de réactivité et de flexibilité","Больше гибкости и скорости реакции","reactiv|flexib|adapt|souple|гибк|реакц|адапт|быстр"],["Communication plus rapide","Более быстрая коммуникация","communic|information|коммуник|информац"],["Autonomie, responsabilisation, motivation","Автономия, ответственность, мотивация","autonom|responsab|motiv|автоном|ответствен|мотив"],["Baisse des coûts","Снижение затрат","couts|cout d|le cout|les cout|cout,|cout.|econom|затрат|эконом|издерж"]],
  a:{fr:"Moins de niveaux hiérarchiques : les décisions et l'information circulent plus vite, l'entreprise devient plus réactive face aux commandes spécifiques. Les ouvriers polyvalents peuvent passer d'une tâche à l'autre (flexibilité), sont plus autonomes et responsabilisés, ce qui peut les motiver. Les coûts d'encadrement baissent.",ru:"Меньше уровней иерархии: решения и информация проходят быстрее, компания гибче реагирует на индивидуальные заказы. Универсальные рабочие переходят с задачи на задачу (гибкость), они автономнее и ответственнее, что может мотивировать. Снижаются расходы на управленческий персонал."}},
 {t:"cas",fr:"Quelle forme de structure devrait-elle adopter ? Pourquoi ?",ru:"Какую структуру ей следует выбрать? Почему?",
  pts:[["Une structure plus plate","Более плоская структура","structure plat|plus plat|aplat|niveau|плоск|уровн"],["Organisée par projets / commandes (ou matricielle)","По проектам / заказам (или матричная)","projet|matric|commande|проект|матриц|заказ"],["Car commandes spécifiques et besoin de réactivité","Потому что заказы индивидуальны и нужна гибкость","specif|reactiv|sur mesure|individual|индивидуал|специфич|гибк|реакц"]],
  a:{fr:"Une structure plate, organisée par projets ou par commandes (éventuellement matricielle : métier + projet client). Elle convient à une production en petites séries sur mesure : des équipes polyvalentes et autonomes suivent chaque commande de bout en bout, ce qui réduit les délais.",ru:"Плоская структура, организованная по проектам или заказам (возможно, матричная: функция + проект клиента). Она подходит для малых индивидуальных серий: универсальные автономные команды ведут каждый заказ от начала до конца, что сокращает сроки."}}
 ]},
{id:"lafuma",src:"td",t:"cas",
 fr:{title:"Le groupe Lafuma",text:["Créée en 1930 par les trois frères Lafuma, l'entreprise invente en 1936 l'armature métallique du sac à dos, puis lance en 1954 le mobilier de camping. Elle grandit par croissance externe : Millet (1995), Oxbow (2005), Eider (2008). Après des pertes, le groupe suisse Calida en prend le contrôle en 2013-2014 (59,92 % du capital).","Le groupe est organisé en trois pôles autonomes : Montagne (Millet, Lafuma), Surf (Oxbow) et Mobilier (Lafuma Mobilier). La logistique, l'industrie et les systèmes d'information sont communs aux trois pôles. En 2019, il réalise 172,6 M€ de chiffre d'affaires avec 1 013 collaborateurs dans 12 pays.","Pour produire, il se demande toujours « make or buy ». Made in France (25 % du CA) : le mobilier fabriqué à Anneyron. Made in Lafuma (13 %) : ses usines de Tunisie et de Hongrie. Made for Lafuma (62 %) : des sous-traitants qui suivent un cahier des charges strict. Sa distribution est multicanale : 76 % via des distributeurs (wholesale), 23 % en direct (boutiques, magasins d'usine, sites internet)."]},
 ru:{title:"Группа Lafuma",text:["Компанию основали в 1930 году три брата Лафума. В 1936 году она изобретает металлический каркас рюкзака, в 1954-м запускает кемпинговую мебель. Она растёт за счёт внешних приобретений: Millet (1995), Oxbow (2005), Eider (2008). После убытков контроль в 2013–2014 годах получает швейцарская группа Calida (59,92% капитала).","Группа разделена на три автономных полюса: Горы (Millet, Lafuma), Сёрф (Oxbow) и Мебель (Lafuma Mobilier). Логистика, производство и информационные системы общие для всех трёх. В 2019 году оборот — 172,6 млн €, 1 013 сотрудников в 12 странах.","Для производства группа всегда задаёт вопрос «make or buy». Made in France (25% оборота): мебель, сделанная в Аннейроне. Made in Lafuma (13%): свои заводы в Тунисе и Венгрии. Made for Lafuma (62%): субподрядчики, работающие по строгому техзаданию. Дистрибуция многоканальная: 76% через дистрибьюторов (wholesale), 23% напрямую (бутики, аутлеты, сайты)."]},
 q:[
 {t:"gouv",fr:"Quelles sont les parties prenantes de cette entreprise ?",ru:"Кто заинтересованные стороны этой компании?",
  pts:[["Actionnaires (Calida)","Акционеры (Calida)","calida|actionnaire|акционер"],["Salariés (1 013)","Сотрудники (1 013)","salari|employ|collabor|personnel|сотрудник|персонал|работник"],["Clients, consommateurs","Клиенты, потребители","client|consommat|клиент|потребител|покупател"],["Fournisseurs, sous-traitants","Поставщики, субподрядчики","fournisseur|sous-trait|sous trait|поставщ|субподряд"],["Distributeurs","Дистрибьюторы","distribut|grossiste|дистриб|оптов"],["État, collectivités, environnement","Государство, общество, экология","etat|communaut|environnement|banque|collectiv|государ|сообществ|эколог|банк|общество"]],
  a:{fr:"Internes : les actionnaires (Calida, majoritaire), les dirigeants et les 1 013 salariés. Externes : les clients et consommateurs, les distributeurs (grossistes, magasins), les fournisseurs et sous-traitants, les banques, l'État et les collectivités locales (emplois, usines), et la société en général (environnement, éco-conception).",ru:"Внутренние: акционеры (Calida — мажоритарий), руководители и 1 013 сотрудников. Внешние: клиенты и потребители, дистрибьюторы (оптовики, магазины), поставщики и субподрядчики, банки, государство и местные власти (рабочие места, заводы), общество в целом (экология, эко-дизайн)."}},
 {t:"cas",fr:"Quelle forme de structure le groupe a-t-il adoptée ? Justifiez.",ru:"Какую структуру выбрала группа? Обоснуйте.",
  pts:[["Structure divisionnelle","Дивизиональная структура","division|дивизион"],["Trois pôles : Montagne, Surf, Mobilier","Три полюса: Горы, Сёрф, Мебель","pole|montagne|surf|mobilier|полюс|горы|серф|мебел"],["Pôles autonomes par activité / produit","Автономные полюса по направлениям / продуктам","autonom|activit|produit|marque|автоном|направлен|продукт|бренд"],["Fonctions communes : logistique, SI, industrie","Общие функции: логистика, ИС, производство","logisti|commun|synerg|systeme|логист|общие|синерг|систем"]],
  a:{fr:"Une structure divisionnelle : trois pôles autonomes (Montagne, Surf, Mobilier), chacun centré sur une activité et ses marques. Chaque pôle s'adapte à ses clients. Certaines fonctions restent communes (logistique, industrie, systèmes d'information) pour faire des économies d'échelle.",ru:"Дивизиональная структура: три автономных полюса (Горы, Сёрф, Мебель), каждый сосредоточен на своём направлении и брендах и подстраивается под своих клиентов. Некоторые функции общие (логистика, производство, ИС) ради экономии на масштабе."}},
 {t:"cas",fr:"Que signifient : Made in France, Made in Lafuma, Made for Lafuma, Make or Buy ?",ru:"Что означают Made in France, Made in Lafuma, Made for Lafuma, Make or Buy?",
  pts:[["Made in France : 25 %, usines en France (mobilier)","Made in France: 25%, заводы во Франции (мебель)","25|anneyron|франц|france"],["Made in Lafuma : 13 %, usines Tunisie et Hongrie","Made in Lafuma: 13%, заводы в Тунисе и Венгрии","13|tunisi|hongri|тунис|венгр"],["Made for Lafuma : 62 %, sous-traitance sur cahier des charges","Made for Lafuma: 62%, субподряд по техзаданию","62|sous-trait|sous trait|cahier|субподряд|техзадан"],["Make or buy : produire soi-même ou faire faire","Make or buy: производить самим или заказать","faire faire|internalis|externalis|acheter|сами|внутр|внешн|покуп|аутсорс|заказ"]],
  a:{fr:"Made in France : produits fabriqués dans les usines françaises du groupe (25 % du CA, surtout le mobilier). Made in Lafuma : produits fabriqués dans ses propres usines délocalisées en Tunisie et en Hongrie (13 %). Made for Lafuma : produits fabriqués par des sous-traitants selon un cahier des charges du groupe (62 %). Make or buy : choisir entre produire soi-même (internaliser) ou acheter / faire faire (externaliser).",ru:"Made in France: продукция французских заводов группы (25% оборота, в основном мебель). Made in Lafuma: продукция собственных заводов за рубежом, в Тунисе и Венгрии (13%). Made for Lafuma: продукция субподрядчиков по техзаданию группы (62%). Make or buy: выбор между собственным производством (интернализация) и покупкой / заказом на стороне (аутсорсинг)."}},
 {t:"cas",fr:"Comment qualifier la distribution du groupe ? Quels en sont les avantages ?",ru:"Как охарактеризовать дистрибуцию группы? Каковы её преимущества?",
  pts:[["Distribution multicanale","Многоканальная дистрибуция","multican|многоканал"],["Wholesale : distributeurs, 76 %","Wholesale: дистрибьюторы, 76%","wholesale|grossiste|76|опт|дистриб"],["Retail direct : boutiques, outlets, e-commerce","Прямые продажи: бутики, аутлеты, онлайн","retail|boutique|outlet|e-commerce|internet|direct|прям|бутик|аутлет|интернет|онлайн"],["Avantages : plus de clients, moins de dépendance, marge, image","Плюсы: больше клиентов, меньше зависимость, маржа, имидж","toucher|dependan|marge|image|visib|risque|охват|зависим|марж|имидж|риск"]],
  a:{fr:"Une distribution multicanale : 76 % via des distributeurs et grossistes (wholesale), 23 % en vente directe (retail : boutiques propres, magasins d'usine, sites internet). Avantages : toucher plus de clients, ne pas dépendre d'un seul canal, mieux maîtriser l'image de marque et les marges, être au contact direct du consommateur.",ru:"Многоканальная дистрибуция: 76% через дистрибьюторов и оптовиков (wholesale), 23% напрямую (retail: свои бутики, аутлеты, сайты). Плюсы: охват большего числа клиентов, нет зависимости от одного канала, лучший контроль имиджа и маржи, прямой контакт с потребителем."}}
 ]},
{id:"morel",src:"fic",t:"podc",
 fr:{title:"La boulangerie de Claire Morel",text:["Claire Morel ouvre sa boulangerie en 2015. Seule maître à bord, elle fait le pain, sert les clients, commande la farine et tient la caisse. Le succès est rapide : en 2024, elle possède quatre boutiques et emploie 38 salariés.","Pourtant, rien n'a changé dans son organisation. Claire décide de tout : les plannings, les recrutements, les commandes de chaque boutique. Le soir, elle vérifie seule la caisse des quatre magasins. Les erreurs se multiplient : deux boutiques commandent les mêmes produits chez le même fournisseur, une autre manque de farine un samedi. Les vendeuses attendent son accord pour la moindre décision et plusieurs démissionnent : « On n'a aucune responsabilité, on ne sait même pas quels sont les objectifs. »","Épuisée, Claire demande conseil à une amie consultante, qui lui dit : « Tu n'as plus une boulangerie, tu as une entreprise. Il te faut une organisation. »"]},
 ru:{title:"Пекарня Клер Морель",text:["Клер Морель открывает пекарню в 2015 году. Она одна на всё: печёт хлеб, обслуживает клиентов, заказывает муку и стоит на кассе. Успех приходит быстро: в 2024 году у неё четыре магазина и 38 сотрудников.","Но в организации ничего не изменилось. Клер решает всё сама: графики, найм, заказы для каждого магазина. Вечером она одна проверяет кассу всех четырёх точек. Ошибок всё больше: два магазина заказывают одно и то же у одного поставщика, в третьем в субботу заканчивается мука. Продавщицы ждут её одобрения по любой мелочи, несколько уволились: «У нас нет никакой ответственности, мы даже не знаем, какие у нас цели».","Измотанная Клер просит совета у подруги-консультанта. Та говорит: «У тебя уже не пекарня, а предприятие. Тебе нужна организация»."]},
 q:[
 {t:"cas",fr:"Quelle logique et quelle structure caractérisent l'entreprise de Claire ? Sont-elles encore adaptées ?",ru:"Какая логика и какая структура у предприятия Клер? Подходят ли они до сих пор?",
  pts:[["Logique entrepreneuriale","Предпринимательская логика","entrepreneur|предприним"],["Structure simple, tout est centralisé chez la fondatrice","Простая структура, всё централизовано у основательницы","simple|centralis|decide de tout|seule |seule,|seule.|прост|централиз|всё сама|одна"],["Plus adaptée à cause de la croissance (4 boutiques, 38 salariés)","Уже не подходит из-за роста (4 магазина, 38 человек)","croiss|taille|38|quatre|4 bout|рост |роста|ростом|вырос|размер|38|четыр|4 маг"]],
  a:{fr:"Une logique entrepreneuriale et une structure simple : la fondatrice décide de tout, sans intermédiaire. Cela marchait avec une boutique. Avec quatre boutiques et 38 salariés, cette centralisation n'est plus adaptée : Claire est débordée, les décisions sont lentes et les erreurs augmentent.",ru:"Предпринимательская логика и простая структура: основательница решает всё без посредников. С одним магазином это работало. С четырьмя магазинами и 38 сотрудниками такая централизация уже не подходит: Клер перегружена, решения медленные, ошибок больше."}},
 {t:"podc",fr:"Quelles fonctions du management sont mal assurées ? Donnez un exemple pour chacune.",ru:"Какие функции менеджмента выполняются плохо? Приведите пример для каждой.",
  pts:[["Organisation / coordination : commandes en double","Организация / координация: двойные заказы","organis|coordin|doublon|double|организ|координ|дубл|двойн"],["Planification : rupture de farine, pas d'objectifs","Планирование: закончилась мука, нет целей","planif|prevo|objectif|rupture|планир|прогноз|цел|закончил"],["Direction : aucune délégation, salariés démotivés","Руководство: нет делегирования, демотивация","deleg|direction|motiv|responsab|делег|руковод|мотив|ответствен"],["Contrôle : tardif et fait par elle seule","Контроль: поздний и только ею","control|verif|caisse|контрол|провер|касс"]],
  a:{fr:"Organisation et coordination : deux boutiques commandent la même chose (doublons). Planification : rupture de farine un samedi, et aucun objectif fixé aux équipes. Direction : Claire ne délègue pas, les vendeuses n'ont pas de responsabilités et démissionnent. Contrôle : elle vérifie seule les caisses le soir, trop tard pour corriger.",ru:"Организация и координация: два магазина заказывают одно и то же (дубли). Планирование: в субботу закончилась мука, командам не поставлены цели. Руководство: Клер не делегирует, у продавщиц нет ответственности, и они увольняются. Контроль: она одна проверяет кассы вечером — слишком поздно, чтобы что-то исправить."}},
 {t:"podc",fr:"Quelles solutions proposez-vous à Claire ?",ru:"Какие решения вы предложите Клер?",
  pts:[["Déléguer : un responsable par boutique","Делегировать: управляющий в каждом магазине","deleg|responsable|gerant|делег|управляющ|ответствен"],["Définir une structure / un organigramme","Создать структуру / оргсхему","structure|organigramme|fonction|структур|оргсхем|функц"],["Centraliser les achats, des procédures communes","Централизовать закупки, общие процедуры","procedur|achat|centralis|fournisseur|процедур|закуп|централиз|поставщ"],["Fixer des objectifs et des indicateurs de suivi","Поставить цели и показатели","objectif|indicat|tableau|suivi|цел|показател|отчет|мониторинг"]],
  a:{fr:"Nommer un responsable par boutique et lui déléguer le planning et les décisions courantes. Dessiner un organigramme simple (Claire à la direction, une personne pour les achats centralisés). Mettre en place des procédures communes de commande. Fixer des objectifs à chaque boutique et suivre quelques indicateurs (ventes, ruptures, pertes).",ru:"Назначить управляющего в каждый магазин и делегировать ему графики и текущие решения. Нарисовать простую оргсхему (Клер — руководство, один человек на централизованные закупки). Ввести общие процедуры заказа. Поставить каждому магазину цели и отслеживать несколько показателей (продажи, нехватки, потери)."}},
 {t:"gm",fr:"Parmi les problèmes du texte, lesquels relèvent de la gestion et lesquels du management ?",ru:"Какие проблемы из текста относятся к gestion, а какие — к менеджменту?",
  pts:[["Gestion : commandes, stocks, caisse, coûts","Gestion: заказы, запасы, касса, затраты","stock|caisse|couts|cout d|le cout|les cout|commande|farine|budget|запас|касс|затрат|заказ|мук|бюджет"],["Management : démotivation, démissions, aucune responsabilité","Менеджмент: демотивация, увольнения, нет ответственности","demission|motiv|responsab|sens|turnover|увол|мотив|ответствен|смысл|текучест"]],
  a:{fr:"Gestion (ressources et chiffres) : commandes en double, rupture de farine, contrôle de la caisse, coûts. Management (dimension humaine) : vendeuses sans responsabilités ni objectifs, démotivation et démissions, absence de délégation.",ru:"Gestion (ресурсы и цифры): двойные заказы, нехватка муки, контроль кассы, затраты. Менеджмент (человеческое измерение): у продавщиц нет ни ответственности, ни целей, демотивация и увольнения, нет делегирования."}}
 ]},
{id:"nova",src:"fic",t:"leader",
 fr:{title:"NovaTech, la start-up sans chefs",text:["Léa et Karim fondent NovaTech en 2019, une start-up qui crée des applications pour les hôpitaux. Ils veulent une entreprise « sans chefs » : pas de niveaux hiérarchiques, chacun choisit ses projets, les décisions sont discutées par toute l'équipe. Avec 25 développeurs, cela fonctionne très bien : l'ambiance est excellente et l'innovation rapide.","En 2024, NovaTech compte 80 personnes. Les problèmes apparaissent : deux équipes développent la même fonctionnalité sans le savoir, personne ne sait qui doit valider un contrat, et les clients se plaignent de retards de livraison. Les réunions durent des heures sans décision.","Dans ce désordre, Inès, développeuse expérimentée, est devenue la personne vers qui tout le monde se tourne. Elle n'a aucun titre officiel, mais ses collègues suivent ses conseils techniques et lui confient les problèmes difficiles."]},
 ru:{title:"NovaTech — стартап без начальников",text:["Леа и Карим основали NovaTech в 2019 году — стартап, который делает приложения для больниц. Они хотят компанию «без начальников»: никаких уровней иерархии, каждый выбирает проекты, решения обсуждает вся команда. С 25 разработчиками это отлично работает: прекрасная атмосфера и быстрые инновации.","В 2024 году в NovaTech уже 80 человек. Появляются проблемы: две команды разрабатывают одну и ту же функцию, не зная об этом, никто не знает, кто утверждает контракт, клиенты жалуются на задержки поставок. Совещания длятся часами без решений.","В этом хаосе Инес, опытная разработчица, стала человеком, к которому все обращаются. У неё нет официальной должности, но коллеги следуют её техническим советам и доверяют ей сложные задачи."]},
 q:[
 {t:"leader",fr:"Quel style de management les fondateurs ont-ils choisi au départ ?",ru:"Какой стиль менеджмента основатели выбрали вначале?",
  pts:[["Participatif / délégatif","Партисипативный / делегирующий","particip|deleg|партисипат|делег|вовлек"],["Autonomie et confiance","Автономия и доверие","autonom|confian|liberte|автоном|довери|свобод"],["Structure plate, sans hiérarchie","Плоская структура без иерархии","structure plat|plus plat|aplat|sans chef|hierarch|плоск|без начальн|иерарх"]],
  a:{fr:"Un style participatif, voire délégatif : les décisions sont prises collectivement et chacun choisit ses projets. Il repose sur l'autonomie et la confiance, dans une structure plate sans niveaux hiérarchiques.",ru:"Партисипативный и даже делегирующий стиль: решения принимаются коллективно, каждый выбирает проекты. Он основан на автономии и доверии в плоской структуре без уровней иерархии."}},
 {t:"podc",fr:"Quels problèmes apparaissent avec la croissance ? À quelles fonctions du management correspondent-ils ?",ru:"Какие проблемы появляются с ростом? Каким функциям менеджмента они соответствуют?",
  pts:[["Coordination : deux équipes font la même chose","Координация: две команды делают одно и то же","coordin|doublon|meme fonction|deux equipes|координ|дубл|одно и то же|две команд"],["Organisation : rôles flous, qui valide ?","Организация: размытые роли, кто утверждает?","organis|role|responsab|valid|qui decide|организ|роль|ответствен|утвержд|кто реш"],["Retards, clients mécontents","Задержки, недовольные клиенты","retard|client|delai|livraison|задерж|клиент|срок"],["Manque de planification et de contrôle","Не хватает планирования и контроля","planif|control|suivi|планир|контрол"]],
  a:{fr:"Coordination : deux équipes développent la même fonctionnalité (doublons). Organisation : les rôles sont flous, personne ne sait qui valide un contrat. Planification et contrôle : pas de calendrier commun ni de suivi, d'où les retards et les clients mécontents. Direction : les réunions n'aboutissent à aucune décision.",ru:"Координация: две команды делают одну функцию (дубли). Организация: роли размыты, никто не знает, кто утверждает контракт. Планирование и контроль: нет общего графика и отслеживания, отсюда задержки и недовольные клиенты. Руководство: совещания не заканчиваются решениями."}},
 {t:"leader",fr:"Inès est-elle une leader, une manager, ou les deux ? Justifiez.",ru:"Инес — лидер, менеджер или и то и другое? Обоснуйте.",
  pts:[["Leader sans être manager","Лидер без должности менеджера","leader|лидер"],["Leader experte (compétence technique)","Лидер-эксперт (техническая компетенция)","expert|techni|competen|эксперт|техни|компетен"],["Influence reconnue par le groupe, pas de pouvoir hiérarchique","Влияние признано группой, нет иерархической власти","influen|reconn|confian|titre|hierarch|влиян|признан|довери|должност|иерарх"]],
  a:{fr:"Inès est une leader sans être manager : elle n'a ni titre ni pouvoir hiérarchique. C'est une leader experte : son influence vient de sa compétence technique et de la confiance que le groupe lui accorde.",ru:"Инес — лидер, не будучи менеджером: у неё нет ни должности, ни иерархической власти. Это лидер-эксперт: её влияние основано на технической компетенции и доверии группы."}},
 {t:"leader",fr:"Quels conseils donneriez-vous aux fondateurs ?",ru:"Какие советы вы дали бы основателям?",
  pts:[["Garder la participation mais clarifier les rôles","Сохранить участие, но прояснить роли","role|clarif|garder|роль|проясн|сохран"],["Créer des responsables d'équipe, coordonner (ex. Inès)","Назначить руководителей команд, координировать (напр. Инес)","coordin|responsable|chef|referent|координ|руковод|тимлид|инес"],["Planifier : objectifs, calendrier, outils de suivi","Планировать: цели, график, инструменты контроля","planif|objectif|calendrier|indicat|suivi|планир|цел|график|показател"],["Adapter le style au contexte (taille)","Адаптировать стиль к контексту (размеру)","situation|contexte|adapt|taille|ситуац|контекст|адапт|размер"]],
  a:{fr:"Garder l'esprit participatif mais adapter le style à la nouvelle taille : clarifier qui décide quoi, créer des responsables d'équipe (Inès pourrait en devenir une, son leadership étant déjà reconnu), coordonner les projets, fixer des objectifs et un calendrier, suivre l'avancement avec quelques indicateurs.",ru:"Сохранить дух участия, но адаптировать стиль к новому размеру: прояснить, кто что решает, назначить руководителей команд (Инес могла бы стать одной из них — её лидерство уже признано), координировать проекты, поставить цели и график, отслеживать прогресс по нескольким показателям."}}
 ]},
{id:"atelier",src:"fic",t:"manager",
 fr:{title:"Marc, nouveau chef d'atelier chez AutoPièces",text:["Marc, 34 ans, excellent ingénieur, vient d'être promu chef d'un atelier de 60 ouvriers qui fabrique des pièces automobiles. Son prédécesseur, très paternaliste, était apprécié mais l'atelier prenait du retard.","Dès son arrivée, Marc impose de nouvelles procédures sans les expliquer. Il mesure chaque jour la production de chaque poste et affiche un classement des ouvriers dans l'atelier. Il règle lui-même un conflit entre l'équipe de jour et l'équipe de nuit, puis répartit autrement les machines. Six mois plus tard, la productivité a augmenté de 4 %, mais l'absentéisme a doublé et les ouvriers parlent de « flicage ».","Un jour, une machine essentielle tombe en panne. Plutôt que de diriger la réparation, Marc laisse Paulo, technicien depuis 25 ans, prendre la direction des opérations. La panne est réparée en deux heures, et l'équipe voit Marc autrement."]},
 ru:{title:"Марк — новый начальник цеха в AutoPièces",text:["Марку 34 года, он отличный инженер и только что стал начальником цеха из 60 рабочих, который производит автозапчасти. Его предшественник, очень патерналистский, был любим, но цех отставал от графика.","С первых дней Марк вводит новые процедуры, не объясняя их. Он ежедневно измеряет выработку каждого поста и вывешивает в цеху рейтинг рабочих. Он сам улаживает конфликт между дневной и ночной сменой, затем перераспределяет станки. Через полгода производительность выросла на 4%, но прогулы удвоились, а рабочие говорят о «слежке».","Однажды ломается ключевой станок. Вместо того чтобы руководить ремонтом, Марк даёт Пауло, технику с 25-летним стажем, взять ремонт в свои руки. Поломку устраняют за два часа, и команда начинает смотреть на Марка иначе."]},
 q:[
 {t:"manager",fr:"Quels rôles de Mintzberg Marc exerce-t-il ? Donnez un exemple par famille.",ru:"Какие роли по Минцбергу выполняет Марк? Приведите пример для каждой группы.",
  pts:[["Interpersonnels (leader, agent de liaison)","Межличностные (лидер, связующее звено)","interpersonn|leader|liaison|межличност|лидер|связ"],["Informationnels : il mesure, observe, diffuse le classement","Информационные: измеряет, наблюдает, публикует рейтинг","information|observ|diffus|mesure|информац|наблюд|распростран|измер"],["Décisionnels : régulateur (conflit), répartiteur (machines)","Решенческие: регулятор (конфликт), распределитель (станки)","decision|regulat|repartit|conflit|machine|решен|регулят|распредел|конфликт|станк"]],
  a:{fr:"Rôles informationnels : il observe et mesure la production de chaque poste, puis diffuse le classement. Rôles décisionnels : régulateur quand il règle le conflit entre équipes, répartiteur de ressources quand il redistribue les machines, entrepreneur quand il change les procédures. Rôles interpersonnels : il est le leader officiel de l'atelier, mais il les exerce mal.",ru:"Информационные: наблюдает и измеряет выработку постов, затем распространяет рейтинг. Решенческие: регулятор, когда улаживает конфликт смен; распределитель ресурсов, когда перераспределяет станки; предприниматель, когда меняет процедуры. Межличностные: он официальный лидер цеха, но выполняет эти роли плохо."}},
 {t:"manager",fr:"Quelle compétence manque le plus à Marc ? Laquelle possède-t-il ?",ru:"Какой компетенции Марку больше всего не хватает? Какой он обладает?",
  pts:[["Il manque de compétence humaine / interpersonnelle","Не хватает человеческой / межличностной","humain|interpersonn|relation|человеч|межличност|коммуникат"],["Il a la compétence technique (ingénieur)","У него есть техническая (инженер)","techni|ingenieur|техни|инженер"],["La compétence politique (soutiens) est aussi faible","Политическая компетенция (поддержка) тоже слабая","politi|soutien|политич|поддерж"]],
  a:{fr:"Il possède une forte compétence technique (excellent ingénieur), mais il manque de compétence humaine (interpersonnelle) : il n'explique pas, ne consulte pas et humilie avec le classement. Sa compétence politique est aussi faible : il n'a pas obtenu le soutien des ouvriers avant de changer les règles.",ru:"У него сильная техническая компетенция (отличный инженер), но не хватает человеческой (межличностной): он не объясняет, не советуется и унижает рейтингом. Политическая компетенция тоже слабая: он не заручился поддержкой рабочих, прежде чем менять правила."}},
 {t:"podc",fr:"Pourquoi les résultats sont-ils mitigés ? Que montre l'exemple du contrôle ?",ru:"Почему результаты неоднозначны? Что показывает пример с контролем?",
  pts:[["Productivité +4 % mais absentéisme doublé","Производительность +4%, но прогулы удвоились","productiv|absente|производительн|прогул|отсутств"],["Contrôle vécu comme surveillance / sanction","Контроль воспринимается как слежка / наказание","surveil|sanction|classement|flicage|надзор|слежк|наказ|рейтинг"],["Changement imposé sans explication → résistance","Изменения без объяснений → сопротивление","resist|expliq|impos|сопротивл|объясн|навяз"]],
  a:{fr:"La productivité progresse (+4 %), mais l'absentéisme double : les ouvriers résistent à un changement imposé sans explication. Le contrôle est vécu comme une surveillance et une sanction (classement affiché), alors qu'il doit servir à comparer résultats et objectifs pour corriger, avec les équipes.",ru:"Производительность растёт (+4%), но прогулы удваиваются: рабочие сопротивляются изменениям, навязанным без объяснений. Контроль воспринимается как слежка и наказание (вывешенный рейтинг), хотя он должен служить сравнению результатов с целями и исправлению вместе с командой."}},
 {t:"leader",fr:"Comment qualifier l'attitude de Marc lors de la panne ?",ru:"Как охарактеризовать поведение Марка во время поломки?",
  pts:[["Leadership situationnel","Ситуационное лидерство","situation|ситуац"],["Humilité","Скромность","humilit|скромн"],["Il s'appuie sur le plus compétent (expert)","Опора на самого компетентного (эксперта)","competen|expert|paulo|компетент|эксперт|пауло"],["Cela renforce la confiance de l'équipe","Это укрепляет доверие команды","confian|довери"]],
  a:{fr:"De l'humilité et du leadership situationnel : Marc abandonne temporairement son rôle central au profit de Paulo, plus compétent sur ce sujet. Cette attitude renforce la confiance de l'équipe et montre que le style doit s'adapter à la situation.",ru:"Скромность и ситуационное лидерство: Марк временно уступает центральную роль Пауло, более компетентному в этом вопросе. Это укрепляет доверие команды и показывает, что стиль должен подстраиваться под ситуацию."}}
 ]},
{id:"hopital",src:"fic",t:"gouv",
 fr:{title:"Hôpital Saint-Clair : qui décide ?",text:["L'hôpital public Saint-Clair emploie 2 400 personnes. Son directeur dispose d'un budget de 210 M€ fixé avec l'agence régionale de santé, qui représente l'État. Il suit des indicateurs : temps d'attente aux urgences, taux d'occupation des lits, coût par patient.","Cette année, le budget baisse de 3 %. Le directeur propose de fermer la maternité, peu rentable. La mairie s'y oppose car la ville perdrait un service essentiel. Les infirmières, en sous-effectif, se mettent en grève. Une association de patients dénonce des attentes de huit heures aux urgences.","La décision finale doit être examinée par le conseil de surveillance de l'hôpital, qui contrôle la direction. On y trouve des élus locaux, des représentants du personnel médical et non médical, et des représentants des usagers."]},
 ru:{title:"Больница Сен-Клер: кто решает?",text:["В государственной больнице Сен-Клер работают 2 400 человек. У директора бюджет 210 млн €, согласованный с региональным агентством здравоохранения, которое представляет государство. Он отслеживает показатели: время ожидания в приёмном отделении, загрузку коек, стоимость лечения пациента.","В этом году бюджет сокращается на 3%. Директор предлагает закрыть малорентабельный роддом. Мэрия против: город потеряет важную службу. Медсёстры, которых не хватает, бастуют. Ассоциация пациентов возмущена восьмичасовым ожиданием в приёмном отделении.","Окончательное решение должен рассмотреть наблюдательный совет больницы, который контролирует руководство. В него входят местные выборные лица, представители медицинского и немедицинского персонала и представители пациентов."]},
 q:[
 {t:"gm",fr:"La gestion concerne-t-elle aussi un hôpital public ? Justifiez avec le texte.",ru:"Касается ли gestion и государственной больницы? Обоснуйте по тексту.",
  pts:[["Oui : toutes les organisations, y compris publiques","Да: все организации, включая государственные","public|toutes|institution|государ|все организ|учрежден"],["Ressources limitées (budget 210 M€, −3 %)","Ограниченные ресурсы (бюджет 210 млн €, −3%)","ressource|budget|210|ресурс|бюджет"],["Indicateurs : attente, occupation, coût","Показатели: ожидание, загрузка, стоимость","indicat|attente|occupation|couts|cout par|показател|ожидан|загруз|стоимост"]],
  a:{fr:"Oui. La gestion concerne toutes les organisations, y compris les institutions publiques. L'hôpital doit utiliser au mieux des ressources limitées (budget de 210 M€, en baisse de 3 %) pour atteindre ses objectifs de soins, et il pilote avec des indicateurs (temps d'attente, occupation des lits, coût par patient).",ru:"Да. Gestion касается всех организаций, включая государственные учреждения. Больница должна наилучшим образом использовать ограниченные ресурсы (бюджет 210 млн €, −3%), чтобы достигать целей лечения, и управляет по показателям (время ожидания, загрузка коек, стоимость лечения)."}},
 {t:"gouv",fr:"Identifiez les parties prenantes et leurs attentes.",ru:"Назовите заинтересованные стороны и их ожидания.",
  pts:[["Patients et association de patients","Пациенты и их ассоциация","patient|usager|пациент"],["Personnel : infirmières, médecins","Персонал: медсёстры, врачи","infirm|medecin|personnel|salari|медсестр|врач|персонал"],["État / agence régionale de santé","Государство / агентство здравоохранения","etat|agence|tutelle|государ|агентств"],["Mairie, ville, élus","Мэрия, город, выборные лица","mairie|ville|elu|commune|мэри|город|выборн"]],
  a:{fr:"Les patients et leur association (soins rapides et de qualité), le personnel (effectifs suffisants, conditions de travail), l'État via l'agence régionale de santé (respect du budget, qualité des soins), la mairie et les élus (garder la maternité et les emplois), sans oublier les fournisseurs.",ru:"Пациенты и их ассоциация (быстрое и качественное лечение), персонал (достаточный штат, условия труда), государство через агентство здравоохранения (соблюдение бюджета, качество лечения), мэрия и выборные лица (сохранить роддом и рабочие места), а также поставщики."}},
 {t:"gouv",fr:"Quel organe contrôle la direction ? Avec quelle structure d'entreprise peut-on le comparer ?",ru:"Какой орган контролирует руководство? С какой структурой компании это можно сравнить?",
  pts:[["Le conseil de surveillance","Наблюдательный совет","surveillance|наблюдат"],["Il contrôle le directeur, qui dirige","Он контролирует директора, который управляет","control|directeur|dirige|контрол|директор|управля"],["Comparable à la structure dualiste (directoire / conseil de surveillance)","Сравнимо с двухуровневой структурой (правление / наблюдательный совет)","dualist|directoire|двухуров|правлен|dualiste"],["Représentants du personnel et des usagers","Представители персонала и пациентов","represent|представит"]],
  a:{fr:"Le conseil de surveillance contrôle la direction, tandis que le directeur pilote l'hôpital. C'est proche d'une structure dualiste d'entreprise : le directoire dirige, le conseil de surveillance contrôle. Ici, le conseil associe plusieurs parties prenantes (élus, représentants du personnel et des usagers).",ru:"Наблюдательный совет контролирует руководство, а директор управляет больницей. Это похоже на двухуровневую структуру компании: правление (directoire) управляет, наблюдательный совет контролирует. Здесь в совет входят разные стейкхолдеры (выборные лица, представители персонала и пациентов)."}},
 {t:"manager",fr:"Comment le directeur peut-il sortir de la crise avec les infirmières ?",ru:"Как директору выйти из кризиса с медсёстрами?",
  pts:[["Dialoguer, négocier (rôle de négociateur)","Диалог, переговоры (роль переговорщика)","negoci|dialog|ecout|reunion|переговор|диалог|слуша|встреч"],["Répartir autrement les ressources, recruter","Перераспределить ресурсы, нанять людей","recrut|ressource|repart|effectif|найм|набор|ресурс|распредел|штат"],["Expliquer les contraintes, communiquer","Объяснить ограничения, общаться","communi|expliq|transpar|общ|объясн|прозрачн"],["Reconnaître et motiver le personnel","Признать и мотивировать персонал","motiv|reconnaiss|мотив|признан"]],
  a:{fr:"Ouvrir le dialogue et négocier avec les représentants des infirmières (rôle de négociateur). Expliquer clairement la contrainte budgétaire. Réallouer des ressources vers les services en sous-effectif ou recruter (rôle de répartiteur). Reconnaître l'effort du personnel pour restaurer la motivation et la confiance.",ru:"Начать диалог и переговоры с представителями медсестёр (роль переговорщика). Ясно объяснить бюджетные ограничения. Перераспределить ресурсы в отделения с нехваткой персонала или нанять людей (роль распределителя). Признать усилия персонала, чтобы вернуть мотивацию и доверие."}}
 ]},
{id:"paniers",src:"fic",t:"leader",
 fr:{title:"L'association Les Paniers Solidaires",text:["Les Paniers Solidaires distribuent chaque samedi des colis alimentaires à 600 familles. L'association compte trois salariés, dont Malik, le coordinateur, et 120 bénévoles. Sa présidente, Sophie, est élue chaque année par l'assemblée générale.","Cette année, la subvention de la ville baisse de 15 %, tandis que les dons des particuliers augmentent. Il faut trouver de nouveaux partenaires et revoir le budget. Mais un autre problème inquiète Sophie : de nombreux bénévoles arrêtent. Ils disent que les plannings changent sans prévenir, que certains samedis ils sont trop nombreux et d'autres pas assez, et que personne ne les remercie.","Une bénévole, Fatou, retraitée, n'a aucun titre dans l'association. Pourtant, chaque samedi, c'est elle que tout le monde suit : elle accueille les nouveaux, répartit les tâches et sait calmer les tensions."]},
 ru:{title:"Ассоциация «Солидарные корзины»",text:["«Солидарные корзины» каждую субботу раздают продуктовые наборы 600 семьям. В ассоциации трое сотрудников, в том числе координатор Малик, и 120 волонтёров. Президента, Софи, каждый год избирает общее собрание.","В этом году субсидия от города сокращается на 15%, а пожертвования частных лиц растут. Нужно искать новых партнёров и пересматривать бюджет. Но Софи тревожит и другое: многие волонтёры уходят. Они говорят, что графики меняются без предупреждения, что в одни субботы их слишком много, а в другие не хватает, и что их никто не благодарит.","Одна волонтёрка, пенсионерка Фату, не занимает никакой должности. Но каждую субботу все следуют именно за ней: она встречает новичков, распределяет задачи и умеет гасить конфликты."]},
 q:[
 {t:"gm",fr:"Pourquoi parle-t-on de gestion dans une association ?",ru:"Почему о gestion говорят и в ассоциации?",
  pts:[["La gestion concerne aussi les organisations à but non lucratif","Gestion касается и некоммерческих организаций","non lucratif|association|toutes|некоммерч|ассоциац|все организ"],["Ressources limitées : subvention, dons, bénévoles","Ограниченные ресурсы: субсидии, пожертвования, волонтёры","subvention|dons|donat|benevol|ressource|budget|субсид|пожертв|волонт|ресурс|бюджет"],["Des objectifs : nourrir 600 familles","Цели: накормить 600 семей","objectif|600|famill|mission|цел|семь|мисси"]],
  a:{fr:"La gestion concerne toutes les organisations, y compris celles à but non lucratif. L'association doit utiliser au mieux des ressources limitées (subvention en baisse de 15 %, dons, temps des bénévoles) pour atteindre son objectif : aider 600 familles chaque semaine.",ru:"Gestion касается всех организаций, включая некоммерческие. Ассоциации нужно наилучшим образом использовать ограниченные ресурсы (субсидия −15%, пожертвования, время волонтёров), чтобы достичь цели: каждую неделю помогать 600 семьям."}},
 {t:"leader",fr:"Fatou est-elle une leader ? Justifiez.",ru:"Является ли Фату лидером? Обоснуйте.",
  pts:[["Oui, leader sans être manager","Да, лидер без должности менеджера","leader|лидер"],["Aucun titre ni pouvoir hiérarchique","Нет должности и иерархической власти","titre|hierarch|statut|officiel|должност|иерарх|статус|официал"],["Influence, confiance, reconnaissance du groupe","Влияние, доверие, признание группы","influen|confian|reconn|suiv|влиян|довери|признан|следу"]],
  a:{fr:"Oui : Fatou est une leader sans être manager. Elle n'a aucun titre ni pouvoir hiérarchique, mais le groupe la reconnaît et la suit. Son influence repose sur la confiance, sa capacité à accueillir, à répartir les tâches et à apaiser les tensions.",ru:"Да: Фату — лидер, не будучи менеджером. У неё нет ни должности, ни иерархической власти, но группа признаёт её и следует за ней. Её влияние основано на доверии, умении принимать новичков, распределять задачи и гасить конфликты."}},
 {t:"podc",fr:"Quelles fonctions du management faut-il améliorer ? Que proposez-vous ?",ru:"Какие функции менеджмента нужно улучшить? Что вы предлагаете?",
  pts:[["Planification : plannings fixés à l'avance","Планирование: графики заранее","planif|planning|horaire|avance|планир|график|расписан|заранее"],["Organisation : répartir les bénévoles selon les besoins","Организация: распределять волонтёров по потребностям","organis|repart|tache|besoin|организ|распредел|задач|потребност"],["Direction : remercier, reconnaître, motiver","Руководство: благодарить, признавать, мотивировать","motiv|reconnaiss|remerci|valoris|мотив|признан|благодар"],["Contrôle : suivre présences et besoins","Контроль: отслеживать присутствие и потребности","control|suivi|presence|контрол|отслеж|присутств"]],
  a:{fr:"Planification : établir les plannings plusieurs semaines à l'avance. Organisation : répartir les bénévoles selon les besoins de chaque samedi (Fatou pourrait devenir référente). Direction : remercier et valoriser les bénévoles. Contrôle : suivre les présences et ajuster.",ru:"Планирование: составлять графики за несколько недель. Организация: распределять волонтёров по потребностям каждой субботы (Фату могла бы стать ответственной). Руководство: благодарить и ценить волонтёров. Контроль: отслеживать присутствие и корректировать."}},
 {t:"leader",fr:"Quel style de management convient le mieux à des bénévoles ? Pourquoi ?",ru:"Какой стиль менеджмента лучше всего подходит для волонтёров? Почему?",
  pts:[["Participatif","Партисипативный","particip|партисипат|вовлек"],["Pas autoritaire : pas de salaire ni de lien de subordination","Не авторитарный: нет зарплаты и подчинения","autorit|salaire|subordin|volontair|libre|авторитар|зарплат|подчинен|добровол"],["Mobiliser par le sens, les valeurs, la reconnaissance","Мобилизовать смыслом, ценностями, признанием","sens|valeur|reconnaiss|cause|смысл|ценност|признан"]],
  a:{fr:"Un style participatif : les bénévoles ne sont pas payés et ne sont pas subordonnés, un style autoritaire les ferait partir. Il faut les associer aux décisions, donner du sens (les valeurs de l'association) et reconnaître leur engagement. Le style dépend toujours du contexte et des personnes.",ru:"Партисипативный стиль: волонтёрам не платят и они не подчинены, авторитарный стиль заставит их уйти. Нужно вовлекать их в решения, давать смысл (ценности ассоциации) и признавать их вклад. Стиль всегда зависит от контекста и людей."}}
 ]},
{id:"musk",src:"reel",t:"leader",
 fr:{title:"Elon Musk rachète Twitter (2022)",text:["En octobre 2022, Elon Musk rachète Twitter pour environ 44 milliards de dollars. Dès le premier jour, il renvoie plusieurs dirigeants. En novembre, environ la moitié des quelque 7 500 salariés est licenciée.","Peu après, il envoie un e-mail demandant aux salariés restants de s'engager dans une culture « extrêmement hardcore », avec de très longues heures de travail, ou de partir avec une indemnité. De nombreux salariés choisissent de partir. Les décisions sont prises très vite, souvent annoncées directement par Musk sur le réseau, comme le lancement d'une vérification payante.","Selon la presse, de nombreux annonceurs suspendent leurs publicités, inquiets pour leur image. Le réseau connaît plusieurs pannes. En 2023, il est rebaptisé X. Les défenseurs de Musk estiment qu'une entreprise en pertes avait besoin d'un choc, ses critiques jugent la méthode brutale et risquée."]},
 ru:{title:"Илон Маск покупает Twitter (2022)",text:["В октябре 2022 года Илон Маск покупает Twitter примерно за 44 млрд долларов. В первый же день он увольняет нескольких топ-менеджеров. В ноябре увольняют около половины из примерно 7 500 сотрудников.","Вскоре он рассылает письмо: оставшиеся сотрудники должны принять «экстремально хардкорную» культуру с очень долгим рабочим днём или уйти с компенсацией. Многие уходят. Решения принимаются очень быстро и часто объявляются самим Маском прямо в соцсети — например, запуск платной верификации.","По данным прессы, многие рекламодатели приостанавливают рекламу, опасаясь за имидж. В сети случаются сбои. В 2023 году её переименовывают в X. Сторонники Маска считают, что убыточной компании нужен был шок, критики — что метод жёсткий и рискованный."]},
 q:[

{id:"nadella",src:"reel",t:"leader",
 fr:{title:"Satya Nadella transforme Microsoft",text:["En février 2014, Satya Nadella devient directeur général de Microsoft. L'entreprise est riche mais réputée pour sa culture de compétition interne : les équipes se méfient les unes des autres et protègent leurs projets.","Nadella veut changer cette culture. Il reprend l'idée de « growth mindset » : passer d'une culture où l'on veut « tout savoir » à une culture où l'on veut « tout apprendre ». Il insiste sur l'écoute, l'empathie et la collaboration entre les équipes. Il fixe une priorité stratégique claire : le cloud (Azure).","Il noue des partenariats avec d'anciens rivaux : Office arrive sur l'iPad d'Apple dès 2014, et Microsoft s'ouvre à Linux. Les résultats suivent : en 2019, Microsoft dépasse les 1 000 milliards de dollars de valeur en Bourse. Nadella raconte cette transformation dans son livre Hit Refresh (2017)."]},
 ru:{title:"Сатья Наделла меняет Microsoft",text:["В феврале 2014 года Сатья Наделла становится генеральным директором Microsoft. Компания богата, но известна культурой внутренней конкуренции: команды не доверяют друг другу и охраняют свои проекты.","Наделла хочет изменить эту культуру. Он берёт идею «growth mindset»: перейти от культуры «я всё знаю» к культуре «я всему учусь». Он делает упор на умение слушать, эмпатию и сотрудничество между командами. И ставит ясный стратегический приоритет — облако (Azure).","Он заключает партнёрства с бывшими соперниками: уже в 2014 году Office выходит на iPad от Apple, Microsoft открывается Linux. Результаты не заставляют ждать: в 2019 году рыночная стоимость Microsoft превышает 1 трлн долларов. Наделла описал эту трансформацию в книге Hit Refresh (2017)."]},
 q:[

/* Question bank for the marathon and the analysis: TD/bonus QCM + questions generated from VF, cards and sorts.
   Card questions draw new distractors on every call. g = concept group, so one run never asks the same card twice. */
function bank(){
  const B=[];
  QS.forEach(q=>B.push({k:"q"+q.id,g:"q"+q.id,t:q.t,a:q.a,fr:q.fr,ru:q.ru,tag:q.id<100?"TD "+q.id:"Bonus"}));
  VF.forEach((v,i)=>B.push({k:"v"+i,g:"v"+i,t:VF_T[i],a:v[2]?0:1,tag:"V/F",
    fr:[v[0],["Vrai","Faux"],"Cette affirmation est "+(v[2]?"vraie.":"fausse.")],
    ru:[v[1],["Верно","Неверно"],"Это утверждение "+(v[2]?"верно.":"неверно.")]}));
  CARDS.forEach((c,i)=>{
    const pick=()=>[i].concat(shuffle(range(CARDS.length).filter(j=>j!==i)).slice(0,3));
    const d=pick(),tm=pick();
    B.push({k:"c"+i+"d",g:"c"+i,t:c[0],a:0,tag:"Def",
      fr:["Quelle est la définition de « "+c[1]+" » ?",d.map(j=>CARDS[j][2]),c[1]+" : "+c[2]],
      ru:["Какое определение у «"+c[3]+"»?",d.map(j=>CARDS[j][4]),c[3]+": "+c[4]]});
    B.push({k:"c"+i+"t",g:"c"+i,t:c[0],a:0,tag:"Def",
      fr:["Quelle notion correspond à : « "+c[2]+" » ?",tm.map(j=>CARDS[j][1]),c[1]+" : "+c[2]],
      ru:["Какое понятие соответствует: «"+c[4]+"»?",tm.map(j=>CARDS[j][3]),c[3]+": "+c[4]]});
  });
  SORTS.forEach(s=>{const m=SORT_META[s.id];s.items.forEach((it,i)=>B.push({k:"s:"+s.id+":"+i,g:"s:"+s.id+":"+i,t:m.t,a:it[2],tag:"Tri",
    fr:[m.fr.split("%").join(it[0]),s.bins.fr,"« "+it[0]+" » → "+s.bins.fr[it[2]]+"."],
    ru:[m.ru.split("%").join(it[1]),s.bins.ru,"«"+it[1]+"» → "+s.bins.ru[it[2]]+"."]}))});
  return B;
}
const BANK_N=QS.length+VF.length+CARDS.length*2+SORTS.reduce((n,s)=>n+s.items.length,0);

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* answer history per item: [times answered, times correct, last timestamp, topic, last result 1/0] */
function rec(k,tp,ok){const r=S.h[k]||[0,0,0,tp,0];r[0]++;if(ok)r[1]++;r[2]=Date.now();r[3]=tp;r[4]=ok?1:0;S.h[k]=r;save()}
const t=k=>(UI[S.lang]&&UI[S.lang][k]!==undefined)?UI[S.lang][k]:UI.fr[k];
const L=o=>o[S.lang]||o.fr;
const $=s=>document.querySelector(s);
const topic=id=>TOPICS.find(x=>x.id===id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=n=>Array.from({length:n},(_,i)=>i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let TIMERS=[];function every(fn,ms){TIMERS.push(setInterval(fn,ms))}function clearTimers(){TIMERS.forEach(clearInterval);TIMERS=[]}

function addXP(n){S.xp=Math.max(0,(S.xp||0)+n);save();hud()}
function level(){const xp=S.xp||0;const lv=Math.min(5,Math.floor(xp/300));return{lv,title:t("titles")[lv],pct:lv>=5?100:Math.round((xp%300)/3)}}
function mastery(tid){const qs=QS.filter(q=>q.t===tid);const ok=qs.filter(q=>S.res[q.id]===true).length;return{ok,n:qs.length,p:Math.round(ok/qs.length*100)}}
function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}

const NAV=["home","cours","qcm","textes","jeux","examen","analyse"];
function shell(){
  const r=curRoute();
  const navHTML=NAV.map(k=>`<a href="#${k}" class="${r===k?"on":""}">${t(k)}</a>`).join("");
  $("#nav").innerHTML=navHTML;
  $("#tabbar").innerHTML=NAV.map(k=>`<a href="#${k}" class="${r===k?"on":""}" aria-label="${t(k)}">${IC[k]}<span>${t(k)}</span></a>`).join("");
  $("#lang-fr").classList.toggle("on",S.lang==="fr");$("#lang-ru").classList.toggle("on",S.lang==="ru");
  $("#lang-fr").setAttribute("aria-pressed",S.lang==="fr");$("#lang-ru").setAttribute("aria-pressed",S.lang==="ru");
  document.documentElement.lang=S.lang;
  $("#foot").textContent=t("foot");
  hud();themeIcon();
}
function hud(){const l=level();$("#xp").innerHTML=`★ ${S.xp||0}<span class="xp-l">&nbsp;${t("xp")} · ${esc(l.title)}</span>`}
function isDark(){if(S.theme)return S.theme==="dark";return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches}
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme")}
function themeIcon(){$("#theme-btn").innerHTML=isDark()?IC.sun:IC.moon}
function curRoute(){const h=(location.hash||"#home").slice(1);const n=h.split("-")[0];const valid=["home","cours","qcm","textes","jeux","examen","analyse","marathon","cartes","eclair","associer","trier"];const m=valid.includes(n)?n:"home";return ["cartes","eclair","associer","trier","marathon"].includes(m)?"jeux":m}

function route(){
  clearTimers();
  const h=(location.hash||"#home").slice(1);
  const i=h.indexOf("-");const name=i<0?h:h.slice(0,i);const arg=i<0?"":h.slice(i+1);
  const views={home:viewHome,cours:viewCours,qcm:viewQcm,jeux:viewJeux,examen:viewExamen,analyse:viewAnalyse,marathon:viewMarathon,textes:viewTextes,cartes:viewCartes,eclair:viewEclair,associer:viewAssocier,trier:viewTrier};
  (views[name]||viewHome)(arg);
  shell();
  window.scrollTo(0,0);
}

/* ================= QCM ================= */
let Q=null;
function viewQcm(arg){
  if(arg){startQuiz(arg);return}
  Q=null;CUR=()=>viewQcm("");
  const nErr=QS.filter(q=>S.res[q.id]===false).length;
  const special=[["all",t("allTD"),t("allTDd"),43],["mix",t("mix"),t("mixD"),QS.length],["bonus",t("bonus"),t("bonusD"),QS.filter(q=>q.id>100).length],["err",t("errs"),nErr?t("errsD"):t("noErr"),nErr]];

  const tps=TOPICS.map(x=>{const m=mastery(x.id);return `<button class="pick sheet" style="--tc:var(--c-${x.id})" data-act="startq" data-v="${x.id}"><span class="chip">${m.n} ${t("questions")}</span><span class="h3">${esc(L(x).t)}</span><span class="bar"><i style="width:${m.p}%"></i></span><span class="mono muted" style="font-size:13px">${m.p}% ${t("mastery")}</span></button>`}).join("");
  render(`<div style="display:flex;flex-direction:column;gap:18px">
    <div><h1 class="h2">${t("qcmT")}</h1><p class="lead" style="margin:8px 0 0">${t("qcmP")}</p></div>
    <div class="grid-cards">${sp}</div>
    <div class="grid-cards">${tps}</div></div>`);
}
function startQuiz(tp){
  let pool;
  if(tp==="all")pool=QS.filter(q=>q.id<100);
  else if(tp==="bonus")pool=shuffle(QS.filter(q=>q.id>100));
  else if(tp==="mix")pool=shuffle(QS);
  else if(tp==="err")pool=shuffle(QS.filter(q=>S.res[q.id]===false));
  else if(topic(tp))pool=shuffle(QS.filter(q=>q.t===tp));
  else pool=[];
  if(!pool.length){location.hash="#qcm";return}
  Q={tp,list:pool,i:0,score:0,picked:null,wrongs:[],order:pool.map(q=>q.fr[1].length>2?shuffle(range(q.fr[1].length)):range(q.fr[1].length))};
  CUR=renderQuiz;renderQuiz();
}
function qTag(q){return q.id<100?t("td")+q.id:t("bonusTag")}
function renderQuiz(){
  if(!Q)return viewQcm("");
  if(Q.i>=Q.list.length)return renderQuizEnd();
  const q=Q.list[Q.i],d=L(q),fr=q.fr,ord=Q.order[Q.i],n=Q.list.length,tp=topic(q.t);
  const showO=S.lang==="ru"&&S.orig;
  const opts=ord.map((oi,k)=>{let c="";if(Q.picked!==null){c=oi===q.a?"ok":oi===Q.picked?"bad":"dim"}
    return `<button class="opt ${c}" data-act="pick" data-v="${oi}" ${Q.picked!==null?"disabled":""}><span class="key">${"ABCD"[k]}</span><span>${esc(d[1][oi])}${showO?`<span class="orig">${esc(fr[1][oi])}</span>`:""}</span></button>`}).join("");
  const ok=Q.picked===q.a;
  const expl=Q.picked!==null?`<div class="expl" role="status"><b class="${ok?"okt":"badt"}">${ok?t("good"):t("bad")}</b> ${ok?"":`${t("answer")} <b>${esc(d[1][q.a])}</b>. `}${esc(d[2])}</div>`:"";
  render(`<div class="quiz" style="--tc:var(--c-${q.t})">
    <div class="qtop"><a class="btn sm ghost" href="#qcm">← ${t("back")}</a><span class="mono">${Q.i+1}/${n}</span><div class="bar"><i style="width:${(Q.i+(Q.picked!==null?1:0))/n*100}%"></i></div><span class="mono">★ ${Q.score}</span></div>
    <div class="qcard sheet">
      <div class="qmeta"><span class="row" style="gap:6px"><span class="chip">${esc(L(tp).t)}</span><span class="chip" style="--tc:var(--muted)">${qTag(q)}</span></span>
        ${S.lang==="ru"?`<button class="btn sm ghost" data-act="orig">${S.orig?t("origOff"):t("origOn")}</button>`:""}</div>
      <div class="qtext">${esc(d[0])}${showO?`<span class="orig">${esc(fr[0])}</span>`:""}</div>
      <div class="opts">${opts}</div>
      ${expl}
      <div class="qfoot"><span class="kbd">${t("kbd")}</span>${Q.picked!==null?`<button class="btn pri" data-act="nextq" id="nextq">${Q.i+1<n?t("nextQ"):t("finish")} →</button>`:""}</div>
    </div></div>`);
  if(Q.picked!==null){const b=$("#nextq");if(b)b.focus({preventScroll:true})}
}
function pickQ(v){
  if(!Q||Q.picked!==null)return;
  const q=Q.list[Q.i];Q.picked=+v;const ok=Q.picked===q.a;
  S.res[q.id]=ok;rec("q"+q.id,q.t,ok);if(ok){Q.score++;addXP(10)}else{Q.wrongs.push(q);save()}
  renderQuiz();
}
function nextQ(){if(!Q||Q.picked===null)return;Q.i++;Q.picked=null;renderQuiz();window.scrollTo(0,0)}
function ring(p,label){const r=62,c=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 150 150"><circle class="bg" cx="75" cy="75" r="${r}"/><circle class="fg" cx="75" cy="75" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/></svg><b>${label}</b></div>`}
function verdict(p){return p>=1?t("r100"):p>=.75?t("r75"):p>=.5?t("r50"):t("r0")}
function renderQuizEnd(){
  const n=Q.list.length,p=Q.score/n;
  const rv=Q.wrongs.map(q=>{const d=L(q);return `<div class="rv"><div class="q">${qTag(q)} · ${esc(d[0])}</div><div class="a-ok">✓ ${esc(d[1][q.a])}</div><div class="muted" style="margin-top:4px">${esc(d[2])}</div></div>`}).join("");
  render(`<div class="result sheet">
    <span class="eyebrow">${t("score")}</span>${ring(p,Q.score+"/"+n)}<p class="h3">${verdict(p)}</p>
    <div class="row" style="justify-content:center">${Q.wrongs.length?`<button class="btn pri" data-act="retryw">${t("retryErr")} (${Q.wrongs.length})</button>`:""}<button class="btn" data-act="startq" data-v="${Q.tp}">${t("again")}</button><a class="btn ghost" href="#qcm">${t("other")}</a></div>
    ${rv?`<div class="review">${rv}</div>`:""}</div>`);
}
function retryWrong(){const w=Q.wrongs;Q={tp:Q.tp,list:shuffle(w),i:0,score:0,picked:null,wrongs:[],order:[]};Q.order=Q.list.map(q=>q.fr[1].length>2?shuffle(range(q.fr[1].length)):range(q.fr[1].length));CUR=renderQuiz;renderQuiz();window.scrollTo(0,0)}

let E=null,examConfirm=false;
const EXAM_N=20,EXAM_MIN=20;
function viewExamen(){

function examStart(){
  const list=shuffle(QS).slice(0,EXAM_N);

  examConfirm=false;CUR=renderExam;renderExam();startExamTimer();

function startExamTimer(){clearTimers();every(()=>{if(!E||E.done)return clearTimers();const el=$("#timer");const left=E.end-Date.now();if(left<=0){E.timeUp=true;examFinish();return}if(el){el.textContent=fmt(left);el.classList.toggle("low",left<120000)}},1000)}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function renderExam(){
  const q=E.list[E.i],d=L(q),fr=q.fr,ord=E.order[E.i],showO=S.lang==="ru"&&S.orig;
  const opts=ord.map((oi,k)=>`<button class="opt ${E.ans[E.i]===oi?"sel":""}" data-act="eans" data-v="${oi}" aria-pressed="${E.ans[E.i]===oi}"><span class="key">${"ABCD"[k]}</span><span>${esc(d[1][oi])}${showO?`<span class="orig">${esc(fr[1][oi])}</span>`:""}</span></button>`).join("");
  const dots=E.list.map((_,i)=>`<button class="${E.ans[i]!==null?"done":""} ${i===E.i?"cur":""}" data-act="ego" data-v="${i}" aria-label="${t("question")} ${i+1}">${i+1}</button>`).join("");
  const un=E.ans.filter(a=>a===null).length;const left=E.end-Date.now();

    <div class="quiz" style="max-width:none;margin:0">
      <div class="qtop"><span class="timer ${left<120000?"low":""}" id="timer">${fmt(left)}</span><span class="mono">${t("question")} ${E.i+1}/${E.list.length}</span>
        ${S.lang==="ru"?`<button class="btn sm ghost" data-act="orig" style="margin-left:auto">${S.orig?t("origOff"):t("origOn")}</button>`:""}</div>
      <div class="qcard sheet">
        <div class="qtext">${esc(d[0])}${showO?`<span class="orig">${esc(fr[0])}</span>`:""}</div>
        <div class="opts">${opts}</div>
        <div class="qfoot"><button class="btn sm" data-act="ego" data-v="${E.i-1}" ${E.i===0?"disabled":""}>← ${t("prevQ")}</button>
          ${E.i<E.list.length-1?`<button class="btn sm pri" data-act="ego" data-v="${E.i+1}">${t("nextQ2")} →</button>`:""}</div>
      </div>
      <div class="callout row" style="justify-content:space-between">
        <span>${un?`<b>${un}</b> ${t("unans")}`:"✓"}</span>
        <button class="btn ${examConfirm?"pri":""}" data-act="efinish">${examConfirm?t("confirmE"):t("finishE")}</button></div>
    </div>
    <div class="dots sheet">${dots}</div></div>`);
}
function examFinish(){
  if(!E||E.done)return;
  E.done=true;clearTimers();
  E.score=E.list.reduce((s,q,i)=>s+(E.ans[i]===q.a?1:0),0);
  E.note=Math.round(E.score/E.list.length*200)/10;
  E.list.forEach((q,i)=>{if(E.ans[i]!==null){S.res[q.id]=E.ans[i]===q.a;rec("q"+q.id,q.t,E.ans[i]===q.a)}});
  if(S.best.exam==null||E.note>S.best.exam)S.best.exam=E.note;
  S.exams.push({ts:Date.now(),v:E.note});S.exams=S.exams.slice(-12);
  addXP(E.score*8);save();CUR=renderExamEnd;renderExamEnd();window.scrollTo(0,0);
}
function mention(n){return n>=16?t("m16"):n>=14?t("m14"):n>=12?t("m12"):n>=10?t("m10"):t("m0")}
function renderExamEnd(){

/* --- Marathon 50 --- */
let M=null;const MARA_N=50;
const DAY=864e5;
/* Never-seen items first, then least recently answered (last-wrong ones pulled ~2 days earlier).
   Round-robin over topics keeps the 50 balanced; one item per concept group. */
function maraPick(){
  const byT={};
  bank().forEach(b=>{const h=S.h[b.k];b.w=h?h[2]-(h[4]?0:2*DAY)+Math.random()*3*DAY:Math.random();(byT[b.t]=byT[b.t]||[]).push(b)});
  Object.values(byT).forEach(a=>a.sort((x,y)=>x.w-y.w));
  const ts=shuffle(Object.keys(byT)),out=[],used=new Set();let k=0;
  while(out.length<MARA_N&&ts.some(tk=>byT[tk].length)){const q=byT[ts[k++%ts.length]];
    while(q.length&&used.has(q[0].g))q.shift();
    if(q.length){const b=q.shift();used.add(b.g);out.push(b)}}
  return shuffle(out);
}
function freshCount(){return bank().filter(b=>!S.h[b.k]).length}
function viewMarathon(){
  if(M){CUR=renderMara;renderMara();return}
  CUR=viewMarathon;
  render(`<div class="result sheet" style="text-align:left;align-items:stretch;--tc:var(--c-leader)">

}
