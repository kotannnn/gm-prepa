{id:13,t:"gm",a:2,fr:["Laquelle de ces situations relève principalement du management plutôt que de la gestion ?",["Contrôler les dépenses réalisées par un service","Répartir les ressources matérielles entre plusieurs équipes","Mobiliser les collaborateurs autour d'une vision et accompagner le changement","Vérifier l'écart entre les ventes prévues et les ventes réalisées"],"Vision, mobilisation, changement = management. Les autres = gestion (chiffres, ressources)."],ru:["Какая ситуация относится скорее к менеджменту, чем к gestion?",["Контролировать расходы отдела","Распределять материальные ресурсы между командами","Мобилизовать сотрудников вокруг видения и сопровождать изменения","Проверять отклонение плановых продаж от фактических"],"Видение, мобилизация, изменения = менеджмент. Остальное = gestion (цифры, ресурсы)."]},
{id:14,t:"podc",a:2,fr:["Quelle association entre une fonction de gestion et son rôle est incorrecte ?",["Planification : définir les objectifs et prévoir les actions","Organisation : répartir les tâches et les responsabilités","Direction : comparer les résultats aux objectifs","Contrôle : apporter des corrections lorsque cela est nécessaire"],"Piège : comparer les résultats aux objectifs, c'est le contrôle. La direction = animer, motiver, guider."],ru:["Какое сочетание функции и её роли НЕВЕРНО?",["Планирование: определить цели и предусмотреть действия","Организация: распределить задачи и ответственность","Руководство: сравнивать результаты с целями","Контроль: вносить исправления при необходимости"],"Ловушка: сравнение результатов с целями — это контроль. Руководство = вести, мотивировать."]},
{id:15,t:"podc",a:1,fr:["Pourquoi le contrôle ne doit-il pas être compris comme une simple surveillance ?",["Parce qu'il consiste uniquement à sanctionner les responsables","Parce qu'il permet de comparer les résultats aux objectifs et d'engager des actions correctives","Parce qu'il intervient avant la définition des objectifs","Parce qu'il remplace la planification et l'organisation"],"Le contrôle sert à corriger et améliorer, pas seulement à surveiller ou sanctionner."],ru:["Почему контроль нельзя понимать как простой надзор?",["Потому что он состоит только в наказании ответственных","Потому что он позволяет сравнить результаты с целями и запустить корректирующие действия","Потому что он происходит до постановки целей","Потому что он заменяет планирование и организацию"],"Контроль нужен, чтобы исправлять и улучшать, а не только следить или наказывать."]},
{id:16,t:"podc",a:0,fr:["Quelle situation illustre le mieux le rôle complémentaire de la planification et du contrôle ?",["Définir des objectifs, mesurer les résultats obtenus et corriger les écarts","Motiver les collaborateurs sans fixer d'objectifs","Répartir les tâches sans vérifier les résultats","Contrôler les dépenses sans prévoir les ressources nécessaires"],"Planifier (objectifs) → contrôler (mesurer) → corriger : les deux fonctions se complètent."],ru:["Какая ситуация лучше показывает взаимодополняемость планирования и контроля?",["Поставить цели, измерить результаты и исправить отклонения","Мотивировать сотрудников без постановки целей","Распределять задачи, не проверяя результаты","Контролировать расходы, не планируя ресурсы"],"Планировать (цели) → контролировать (измерять) → исправлять: функции дополняют друг друга."]},
{id:17,t:"gm",a:1,fr:["La gestion concerne :",["Exclusivement les entreprises commerciales","Les entreprises, les institutions publiques et les organisations à but non lucratif","Uniquement les organisations disposant d'un service financier","Seulement les projets entrepreneuriaux"],"Toute organisation qui a des ressources et des objectifs doit être gérée."],ru:["Gestion касается:",["Исключительно коммерческих предприятий","Предприятий, государственных учреждений и некоммерческих организаций","Только организаций с финансовым отделом","Только предпринимательских проектов"],"Любой организацией с ресурсами и целями нужно управлять."]},
{id:18,t:"gm",a:1,fr:["Quelle affirmation explique le mieux l'importance stratégique de la gestion ?",["Elle garantit automatiquement la réussite de toute organisation","Elle contribue à la performance, à la compétitivité et à la pérennité de l'organisation","Elle permet uniquement d'améliorer les relations entre les salariés","Elle remplace les décisions prises par la direction générale"],"Elle contribue (sans garantir) à la performance, la compétitivité et la pérennité."],ru:["Что лучше объясняет стратегическую важность gestion?",["Она автоматически гарантирует успех любой организации","Она способствует результативности, конкурентоспособности и долговечности организации","Она лишь улучшает отношения между сотрудниками","Она заменяет решения высшего руководства"],"Способствует (но не гарантирует) результативности, конкурентоспособности и долговечности."]},
{id:19,t:"gouv",a:2,fr:["Qu'est-ce que la gouvernance d'entreprise ?",["Un ensemble de lois et de réglementations imposées aux entreprises","Un système de gestion financière et comptable","Un ensemble de principes et de pratiques qui guident la direction et le contrôle des entreprises","Une stratégie marketing pour améliorer l'image de l'entreprise"],"Définition du cours : principes et pratiques de direction et de contrôle."],ru:["Что такое корпоративное управление (gouvernance d'entreprise)?",["Совокупность законов и правил, навязанных компаниям","Система финансового и бухгалтерского учёта","Совокупность принципов и практик, которые направляют руководство и контроль компаний","Маркетинговая стратегия для улучшения имиджа"],"Определение из курса: принципы и практики руководства и контроля."]},
{id:20,t:"gouv",a:1,fr:["Qui sont les principales parties prenantes d'une entreprise ?",["Les actionnaires seulement","Les employés, les clients, les fournisseurs, les communautés locales et les actionnaires","Les concurrents, les médias et les organisations non gouvernementales (ONG)","Le gouvernement et les organismes de réglementation"],"Les parties prenantes principales sont tous ceux qui sont directement liés à l'activité."],ru:["Кто главные заинтересованные стороны (parties prenantes) компании?",["Только акционеры","Сотрудники, клиенты, поставщики, местные сообщества и акционеры","Конкуренты, СМИ и НКО","Государство и регулирующие органы"],"Главные стейкхолдеры — все, кто напрямую связан с деятельностью компании."]},
{id:21,t:"gouv",a:1,fr:["Quel est le rôle du conseil d'administration dans la gouvernance d'entreprise ?",["Gérer les opérations quotidiennes de l'entreprise","Superviser la direction de l'entreprise et protéger les intérêts des parties prenantes","Prendre toutes les décisions stratégiques de l'entreprise","Contrôler les activités du service des ressources humaines"],"Le CA supervise, il ne gère pas le quotidien (c'est la direction générale)."],ru:["Какова роль совета директоров (conseil d'administration)?",["Управлять повседневной работой","Надзирать за руководством компании и защищать интересы стейкхолдеров","Принимать все стратегические решения","Контролировать отдел кадров"],"Совет надзирает, а не управляет повседневно (это делает гендиректор)."]},
{id:22,t:"manager",a:2,fr:["Un responsable établit un budget, contrôle les dépenses et planifie les stocks. Il exerce principalement :",["Une activité de leadership","Une activité de gouvernance","Une activité de gestion"],"Budget, dépenses, stocks = utilisation des ressources → gestion."],ru:["Руководитель составляет бюджет, контролирует расходы и планирует запасы. Он в основном занимается:",["Лидерством","Корпоративным управлением","Управлением ресурсами (gestion)"],"Бюджет, расходы, запасы = использование ресурсов → gestion."]},
{id:23,t:"manager",a:0,fr:["Le même responsable motive son équipe, règle un conflit et accompagne une transformation organisationnelle. Il exerce alors principalement :",["Une fonction de management","Une fonction de contrôle financier","Une fonction d'audit externe","Une fonction de conformité réglementaire"],"Motiver, gérer un conflit, accompagner le changement = management."],ru:["Тот же руководитель мотивирует команду, решает конфликт и сопровождает организационные изменения. Он выполняет:",["Функцию менеджмента","Функцию финансового контроля","Функцию внешнего аудита","Функцию регуляторного соответствия"],"Мотивировать, решать конфликт, сопровождать изменения = менеджмент."]},
{id:24,t:"gm",a:1,fr:["Dans le cours, la gestion est principalement associée à quelle temporalité ?",["L'immédiateté et l'absence de planification","Le court et le moyen terme, avec des processus, des budgets et des indicateurs","Le très long terme uniquement, avec la culture d'entreprise","Une temporalité indépendante des objectifs"],"Gestion = court / moyen terme, outillée par processus, budgets, indicateurs."],ru:["С каким временным горизонтом в курсе связана gestion?",["Сиюминутность и отсутствие планирования","Кратко- и среднесрочный, с процессами, бюджетами и показателями","Только очень долгий срок и корпоративная культура","Горизонт, не зависящий от целей"],"Gestion = кратко-/среднесрочный горизонт: процессы, бюджеты, показатели."]},
{id:25,t:"gm",a:1,fr:["Quelle situation illustre une limite de la gestion lorsqu'elle n'est pas complétée par le management ?",["Les objectifs sont définis et les indicateurs sont suivis","Les procédures sont respectées, mais les salariés ne comprennent pas le sens de leur travail et se désengagent","Les ressources sont réparties entre les différents services","Les écarts entre les résultats et les objectifs sont corrigés"],"Sans management, la gestion ne donne pas de sens et ne motive pas."],ru:["Какая ситуация показывает предел gestion без менеджмента?",["Цели поставлены, показатели отслеживаются","Процедуры соблюдаются, но сотрудники не понимают смысла работы и теряют вовлечённость","Ресурсы распределены между отделами","Отклонения результатов от целей исправляются"],"Без менеджмента gestion не даёт смысла и не мотивирует."]},
{id:26,t:"podc",a:1,fr:["Une entreprise élabore un plan qui fixe précisément les actions à mener, mais l'environnement évolue brutalement. Quel risque encourt cette entreprise ?",["Une amélioration automatique de la créativité","Une rigidité empêchant l'organisation de s'adapter rapidement","Une disparition des objectifs stratégiques","Une augmentation systématique de la motivation"],"Plan trop précis + environnement changeant = rigidité."],ru:["Компания составила план, точно фиксирующий действия, но среда резко изменилась. Какой риск?",["Автоматический рост креативности","Жёсткость, мешающая быстро адаптироваться","Исчезновение стратегических целей","Систематический рост мотивации"],"Слишком точный план + меняющаяся среда = жёсткость (rigidité)."]},
{id:27,t:"podc",a:1,fr:["Quelle affirmation concernant la planification est exacte ?",["Seuls les managers qui rédigent un plan formel planifient réellement","Tous les managers planifient, même si le degré de formalisation varie","La planification exclut toute adaptation ultérieure","La planification ne concerne que les objectifs financiers"],"Tout manager planifie ; seul le degré de formalisation change."],ru:["Какое утверждение о планировании верно?",["Реально планируют только те, кто пишет формальный план","Все менеджеры планируют, даже если степень формализации разная","Планирование исключает последующую адаптацию","Планирование касается только финансовых целей"],"Каждый менеджер планирует; меняется лишь степень формализации."]},
{id:28,t:"podc",a:1,fr:["La planification facilite le contrôle parce qu'elle :",["Supprime la nécessité de mesurer les résultats","Définit des objectifs et des normes permettant d'évaluer les performances","Remplace les indicateurs de performance","Confie le contrôle exclusivement aux actionnaires"],"Sans objectifs ni normes, on ne peut rien comparer : la planification prépare le contrôle."],ru:["Планирование облегчает контроль, потому что оно:",["Устраняет необходимость измерять результаты","Задаёт цели и нормы для оценки результатов","Заменяет показатели эффективности","Передаёт контроль только акционерам"],"Без целей и норм сравнивать нечего: планирование готовит контроль."]},
{id:29,t:"podc",a:1,fr:["Une bonne organisation permet principalement :",["D'éviter toute prise de décision collective","De clarifier les rôles, de répartir les responsabilités et de faciliter le flux de travail","De supprimer les relations informelles","De réduire le rôle de la direction à une fonction administrative"],"Organisation = rôles clairs, responsabilités réparties, travail fluide."],ru:["Хорошая организация прежде всего позволяет:",["Избежать любых коллективных решений","Прояснить роли, распределить ответственность и облегчить поток работы","Устранить неформальные отношения","Свести роль руководства к администрированию"],"Организация = ясные роли, распределённая ответственность, плавная работа."]},
{id:30,t:"podc",a:0,fr:["La coordination vise à :",["Synchroniser les activités et les efforts afin d'éviter les doublons, les retards et les conflits","Concentrer toutes les décisions entre les mains d'un seul dirigeant","Remplacer la planification stratégique","Contrôler uniquement les résultats financiers"],"Coordonner = synchroniser pour éviter doublons, retards et conflits."],ru:["Координация направлена на то, чтобы:",["Синхронизировать действия и усилия, избегая дублирования, задержек и конфликтов","Сосредоточить все решения в руках одного руководителя","Заменить стратегическое планирование","Контролировать только финансовые результаты"],"Координировать = синхронизировать, чтобы избежать дублей, задержек, конфликтов."]},
{id:31,t:"podc",a:0,fr:["Quel ensemble correspond le mieux aux activités d'animation du manager ?",["Former, fixer les objectifs individuels, communiquer, motiver et évaluer","Établir les comptes annuels, auditer et certifier les états financiers","Définir les lois, contrôler les marchés et sanctionner les entreprises","Concevoir les produits, fixer les prix et organiser la distribution"],"L'animation (direction) porte sur les personnes : former, objectifs, communication, motivation, évaluation."],ru:["Что лучше всего соответствует деятельности менеджера по «animation» (ведению людей)?",["Обучать, ставить индивидуальные цели, общаться, мотивировать и оценивать","Составлять годовую отчётность, проводить аудит","Устанавливать законы, контролировать рынки","Разрабатывать продукты, устанавливать цены"],"Animation (руководство) — про людей: обучение, цели, общение, мотивация, оценка."]},
{id:32,t:"manager",a:1,fr:["Le manager est principalement celui qui :",["Exécute personnellement toutes les tâches de l'organisation","Mobilise les ressources d'autres individus et transforme les compétences individuelles en performance collective","Représente uniquement les actionnaires","Contrôle exclusivement la conformité juridique"],"Le manager fait travailler les autres ensemble : compétences individuelles → performance collective."],ru:["Менеджер — это прежде всего тот, кто:",["Лично выполняет все задачи организации","Мобилизует ресурсы других людей и превращает индивидуальные компетенции в коллективный результат","Представляет только акционеров","Контролирует только юридическое соответствие"],"Менеджер организует совместную работу: индивидуальные компетенции → коллективный результат."]},
{id:33,t:"manager",a:2,fr:["Quelle proposition décrit correctement les rôles décisionnels du manager ?",["Figure de proue, leader et agent de liaison","Observateur, diffuseur d'information et porte-parole","Entrepreneur, régulateur, répartiteur de ressources et négociateur","Auditeur, comptable, contrôleur et juriste"],"Mintzberg : A = interpersonnels, B = informationnels, C = décisionnels. Sur la copie, A est coché, mais la bonne réponse est C."],ru:["Какой вариант правильно описывает решенческие (décisionnels) роли менеджера?",["Символ, лидер и связующее звено","Наблюдатель, распространитель информации и представитель","Предприниматель, регулятор, распределитель ресурсов и переговорщик","Аудитор, бухгалтер, контролёр и юрист"],"Минцберг: A = межличностные, B = информационные, C = решенческие. В копии отмечен A, но правильно — C."]},
{id:34,t:"manager",a:1,fr:["Un manager collecte des informations, les analyse et les transmet aux services concernés. Quels rôles exerce-t-il principalement ?",["Des rôles interpersonnels","Des rôles informationnels","Des rôles décisionnels uniquement","Des rôles exclusivement politiques"],"Collecter (observateur) + transmettre (diffuseur) = rôles informationnels. Sur la copie, C est coché, c'est une erreur."],ru:["Менеджер собирает информацию, анализирует и передаёт её службам. Какие роли он выполняет?",["Межличностные","Информационные","Только решенческие","Исключительно политические"],"Собирать (наблюдатель) + передавать (распространитель) = информационные роли. В копии отмечен C — это ошибка."]},
{id:35,t:"manager",a:1,fr:["Quelle compétence permet au manager d'analyser des situations complexes et de prendre des décisions appropriées ?",["La compétence technique","La compétence conceptuelle","La compétence politique uniquement","La compétence administrative"],"Conceptuelle = analyse, vision d'ensemble, décision."],ru:["Какая компетенция позволяет менеджеру анализировать сложные ситуации и принимать адекватные решения?",["Техническая","Концептуальная","Только политическая","Административная"],"Концептуальная = анализ, видение целого, принятие решений."]},
{id:36,t:"manager",a:0,fr:["La compétence politique du manager consiste notamment à :",["Développer une influence et obtenir les soutiens nécessaires au développement de ses activités","Maîtriser uniquement les outils informatiques","Remplacer la compétence interpersonnelle","Contrôler les stocks et les achats"],"Politique = influence, réseau, soutiens."],ru:["Политическая компетенция менеджера состоит, в частности, в том, чтобы:",["Развивать влияние и получать поддержку, необходимую для развития своей деятельности","Владеть только IT-инструментами","Заменять межличностную компетенцию","Контролировать запасы и закупки"],"Политическая = влияние, связи, поддержка."]},
{id:37,t:"leader",a:1,fr:["Peut-on être leader sans être manager ?",["Non, car le leadership suppose obligatoirement une fonction hiérarchique","Oui, par exemple en tant que leader expert, stratège, rénovateur ou coach","Oui, mais uniquement dans les entreprises familiales","Non, sauf si l'on est nommé par le conseil d'administration"],"Le leadership vient de la reconnaissance du groupe, pas du poste."],ru:["Можно ли быть лидером, не будучи менеджером?",["Нет, лидерство обязательно требует иерархической должности","Да, например как лидер-эксперт, стратег, реформатор или коуч","Да, но только в семейных компаниях","Нет, если не назначен советом директоров"],"Лидерство — от признания группы, а не от должности."]},
{id:38,t:"leader",a:1,fr:["Quelle proposition définit le mieux le leadership ?",["L'exercice d'un pouvoir hiérarchique imposé par l'organisation","La capacité à influencer et fédérer un groupe autour d'un but commun, dans une relation de confiance","Le contrôle des ressources financières d'une organisation","L'application stricte des procédures internes"],"Influence + but commun + confiance."],ru:["Какое определение лидерства лучшее?",["Осуществление иерархической власти, навязанной организацией","Способность влиять на группу и объединять её вокруг общей цели в отношениях доверия","Контроль финансовых ресурсов","Строгое соблюдение внутренних процедур"],"Влияние + общая цель + доверие."]},
{id:39,t:"leader",a:0,fr:["Pourquoi le leadership est-il présenté comme limité dans le temps ?",["Parce que l'influence du leader dépend des situations, de l'environnement et de la reconnaissance du groupe","Parce qu'un leader ne peut jamais conserver la confiance de son équipe","Parce que le leadership repose uniquement sur une fonction temporaire","Parce que le manager doit toujours remplacer le leader après une crise"],"Le leader l'est tant que la situation et le groupe le reconnaissent."],ru:["Почему лидерство считается ограниченным во времени?",["Потому что влияние лидера зависит от ситуации, среды и признания группой","Потому что лидер никогда не сохраняет доверие команды","Потому что лидерство основано только на временной должности","Потому что после кризиса менеджер всегда заменяет лидера"],"Лидер остаётся лидером, пока ситуация и группа его признают."]},
{id:40,t:"leader",a:1,fr:["Un manager abandonne temporairement son rôle central au profit d'un collaborateur plus compétent sur un sujet précis. Cette attitude illustre principalement :",["L'autoritarisme","L'humilité et le leadership situationnel","La perte définitive de son statut hiérarchique","Le refus de déléguer"],"S'adapter à la situation et laisser la place au plus compétent = leadership situationnel."],ru:["Менеджер временно уступает центральную роль более компетентному в конкретном вопросе сотруднику. Это пример:",["Авторитаризма","Скромности и ситуационного лидерства","Окончательной потери статуса","Отказа делегировать"],"Адаптироваться к ситуации и уступить самому компетентному = ситуационное лидерство."]},
{id:41,t:"leader",a:2,fr:["Le style de management doit être choisi en fonction :",["De la personnalité du manager uniquement","Du niveau hiérarchique du manager uniquement","De l'influence du manager, des subordonnés et du contexte","Des préférences des actionnaires exclusivement"],"Trois facteurs : manager + subordonnés + contexte. Méfie-toi des mots « uniquement » / « exclusivement »."],ru:["Стиль менеджмента нужно выбирать в зависимости от:",["Только характера менеджера","Только его уровня в иерархии","Влияния менеджера, подчинённых и контекста","Исключительно предпочтений акционеров"],"Три фактора: менеджер + подчинённые + контекст. Слова «только» / «исключительно» обычно — ловушка."]},
{id:42,t:"gouv",a:1,fr:["Dans une structure dualiste, le directoire :",["Contrôle le conseil de surveillance","Pilote l'entreprise, tandis que son activité est contrôlée par le conseil de surveillance","Représente uniquement les actionnaires minoritaires","Se limite à approuver les comptes annuels"],"Directoire = pilote ; conseil de surveillance = contrôle."],ru:["В двухуровневой (dualiste) структуре правление (directoire):",["Контролирует наблюдательный совет","Управляет компанией, а его работу контролирует наблюдательный совет","Представляет только миноритарных акционеров","Лишь утверждает годовую отчётность"],"Directoire = управляет; conseil de surveillance = контролирует."]},
{id:43,t:"gouv",a:1,fr:["Quel rôle les salariés peuvent-ils jouer dans la gouvernance ?",["Ils ne disposent d'aucun moyen d'action dans l'entreprise","Ils peuvent agir par l'intermédiaire de représentants du personnel et exercer certains droits, comme le droit d'alerte","Ils remplacent obligatoirement le conseil d'administration","Ils contrôlent seuls la rémunération des dirigeants"],"Représentants du personnel + droit d'alerte."],ru:["Какую роль сотрудники могут играть в корпоративном управлении?",["У них нет никаких средств влияния","Они действуют через представителей персонала и имеют некоторые права, например право на тревожное уведомление (droit d'alerte)","Они обязательно заменяют совет директоров","Они одни контролируют вознаграждение руководителей"],"Представители персонала + droit d'alerte."]},
/* bonus */
{id:101,t:"leader",a:1,fr:["D'après l'étude de cas, comment qualifier le style de management de Steve Jobs ?",["Participatif et délégatif","Autoritaire et directif, centré sur le contrôle","Laisser-faire","Consultatif"],"Décisions seul, contrôle de tout, peur : style autoritaire / directif."],ru:["Как по кейсу охарактеризовать стиль Стива Джобса?",["Партисипативный и делегирующий","Авторитарный и директивный, с упором на контроль","Попустительский (laisser-faire)","Консультативный"],"Решает сам, контролирует всё, страх: авторитарный / директивный стиль."]},
{id:102,t:"leader",a:2,fr:["Chez Apple sous Steve Jobs, la « culture du oui » signifiait :",["Les salariés pouvaient proposer librement toute idée","Les décisions étaient votées collectivement","Il était formellement déconseillé de ne pas approuver les décisions de la société","Les clients avaient toujours raison"],"Toute tentative de changement ou d'influence était mal perçue."],ru:["Что означала «культура да» в Apple при Джобсе?",["Сотрудники могли свободно предлагать идеи","Решения принимались голосованием","Не одобрять решения компании было категорически не рекомендовано","Клиент всегда прав"],"Любая попытка изменений или влияния воспринималась плохо."]},
{id:103,t:"leader",a:0,fr:["Quel inconvénient du style de Steve Jobs ressort du texte ?",["Une pression constante, du stress et une grande fatigue physique et morale","Un manque total de contrôle sur les projets","Une absence de vision produit","Des délais trop longs accordés aux équipes"],"Le texte : « une pression constante, du stress et une grande fatigue physique et morale »."],ru:["Какой минус стиля Джобса следует из текста?",["Постоянное давление, стресс и сильная физическая и моральная усталость","Полное отсутствие контроля над проектами","Отсутствие продуктового видения","Слишком долгие сроки для команд"],"В тексте: «постоянное давление, стресс, физическая и моральная усталость»."]},
{id:104,t:"leader",a:1,fr:["Pourquoi Steve Jobs a-t-il été renvoyé de sa propre firme en 1985 ?",["Pour fraude financière","Son caractère colérique et le fait d'ignorer l'avis des actionnaires, financiers et partenaires","Parce qu'il avait délocalisé la production","Parce qu'il refusait d'innover"],"Son comportement envers actionnaires et partenaires lui a valu d'être renvoyé en 1985."],ru:["Почему Стива Джобса уволили из собственной компании в 1985?",["За финансовое мошенничество","Из-за вспыльчивости и игнорирования мнения акционеров, финансистов и партнёров","Из-за переноса производства за рубеж","Из-за отказа от инноваций"],"Поведение с акционерами и партнёрами привело к увольнению в 1985."]},
{id:105,t:"cas",a:2,fr:["Chez Muller-Schuster, qu'est-ce qui marque le passage à une logique managériale en 2010 ?",["L'absorption de deux concurrents","La transformation en société anonyme","Tony Schuster confie la direction à un ingénieur expérimenté tout en conservant la propriété du capital","La création d'une crèche d'entreprise"],"Séparation propriété (capital) / direction (dirigeant professionnel) = logique managériale."],ru:["Что в Muller-Schuster знаменует переход к управленческой логике в 2010?",["Поглощение двух конкурентов","Преобразование в АО","Тони Шустер передаёт руководство опытному инженеру, сохраняя собственность на капитал","Открытие корпоративного детского сада"],"Разделение собственности (капитал) и руководства (наёмный профессионал) = управленческая логика."]},
{id:106,t:"cas",a:3,fr:["Muller-Schuster : à combien d'euros de production correspond 1 € investi en 2009 ?",["6,70","8,3","10","5,90"],"1988 : 6,70 F ; 1998 : 8,3 ; 2009 : 5,90 € → la productivité baisse."],ru:["Muller-Schuster: сколько евро продукции даёт 1 € инвестиций в 2009?",["6,70","8,3","10","5,90"],"1988: 6,70 F; 1998: 8,3; 2009: 5,90 € → производительность падает."]},
{id:107,t:"cas",a:1,fr:["Quels objectifs le nouveau dirigeant de Muller-Schuster fixe-t-il pour 2011 ?",["CA −5 %, productivité +10 %","CA +5 %, productivité +3 %, résultat d'exploitation +5 %","−20 % de CO2 en 1 an","Délocalisation en Europe de l'Est"],"Objectifs chiffrés et communiqués à tous : signe de logique managériale."],ru:["Какие цели новый руководитель Muller-Schuster ставит на 2011?",["Оборот −5%, производительность +10%","Оборот +5%, производительность +3%, операционный результат +5%","−20% CO2 за год","Перенос производства в Восточную Европу"],"Цели в цифрах, сообщённые всем: признак управленческой логики."]},
{id:108,t:"cas",a:2,fr:["Muller-Schuster supprime des postes de chefs d'équipe et rend les ouvriers polyvalents. Quel avantage en attend-elle ?",["Plus de niveaux hiérarchiques et plus de contrôle","Une production en grandes séries standardisées","Une structure plus plate, plus réactive, avec une communication plus rapide et plus d'autonomie","La suppression de toute coordination"],"Moins de niveaux = décisions et informations plus rapides, adaptées aux commandes spécifiques."],ru:["Muller-Schuster сокращает бригадиров и делает рабочих универсальными. Какое преимущество ожидается?",["Больше уровней иерархии и контроля","Производство больших стандартных серий","Более плоская и гибкая структура, быстрая коммуникация и больше автономии","Отмена любой координации"],"Меньше уровней = быстрее решения и информация, лучше под индивидуальные заказы."]},
{id:109,t:"cas",a:1,fr:["Lafuma est organisé en trois pôles autonomes (Montagne, Surf, Mobilier). De quel type de structure s'agit-il ?",["Structure simple","Structure divisionnelle","Structure fonctionnelle","Structure entrepreneuriale"],"Découpage par activités / produits = divisionnelle."],ru:["Lafuma организована в 3 автономных полюса (Горы, Сёрф, Мебель). Какая это структура?",["Простая","Дивизиональная","Функциональная","Предпринимательская"],"Деление по направлениям / продуктам = дивизиональная."]},
{id:110,t:"cas",a:2,fr:["« Made for Lafuma » désigne :",["La production dans les usines françaises (25 %)","La production dans les usines de Tunisie et de Hongrie (13 %)","La sous-traitance à partir d'un cahier des charges strict fourni par le groupe (62 %)","La vente directe en boutiques"],"Made for = fabriqué POUR Lafuma par des sous-traitants : 62 % en équivalent CA."],ru:["«Made for Lafuma» означает:",["Производство на французских заводах (25%)","Производство на заводах в Тунисе и Венгрии (13%)","Субподряд по строгому техзаданию группы (62%)","Прямые продажи в бутиках"],"Made for = сделано ДЛЯ Lafuma субподрядчиками: 62% оборота."]},
{id:111,t:"cas",a:0,fr:["Que signifie « Make or Buy » ?",["Choisir entre produire soi-même ou acheter / sous-traiter","Choisir entre vendre en gros ou au détail","Choisir entre deux fournisseurs étrangers","Fabriquer pour stocker ou pour vendre"],"Make = internaliser ; buy = externaliser."],ru:["Что означает «Make or Buy»?",["Выбор: производить самим или покупать / отдавать на субподряд","Выбор: оптом или в розницу","Выбор между двумя иностранными поставщиками","Производить на склад или на продажу"],"Make = делать самим; buy = отдать внешним исполнителям."]},
{id:112,t:"cas",a:1,fr:["Dans la distribution de Lafuma, le « wholesale » correspond à :",["La vente directe en boutiques propres et en ligne","La vente via des distributeurs / grossistes (environ 76 %)","Les magasins d'usine uniquement","La vente aux salariés"],"Wholesale = grossistes (76 %) ; retail = direct (23 %)."],ru:["В дистрибуции Lafuma «wholesale» — это:",["Прямые продажи в своих бутиках и онлайн","Продажи через дистрибьюторов / оптовиков (около 76%)","Только фабричные магазины","Продажи сотрудникам"],"Wholesale = оптовики (76%); retail = напрямую (23%)."]},
{id:113,t:"cas",a:0,fr:["À quoi sert le bilan ?",["Présenter le patrimoine de l'entreprise (actif / passif) à une date donnée","Calculer le résultat à partir des produits et des charges","Lister les parties prenantes","Mesurer la satisfaction des clients"],"Bilan = photo du patrimoine à une date (ex. 31.12.2019)."],ru:["Для чего нужен баланс (bilan)?",["Показать имущество компании (актив / пассив) на определённую дату","Рассчитать результат по доходам и расходам","Перечислить стейкхолдеров","Измерить удовлетворённость клиентов"],"Bilan = «фото» имущества на дату (напр. 31.12.2019)."]},
{id:114,t:"cas",a:1,fr:["À quoi sert le compte de résultat ?",["Décrire le patrimoine à une date donnée","Retracer les produits et les charges de l'exercice pour dégager un bénéfice ou une perte","Présenter l'organigramme","Évaluer les concurrents"],"Compte de résultat = « film » de l'année : produits − charges = résultat."],ru:["Для чего нужен отчёт о прибылях (compte de résultat)?",["Описать имущество на дату","Отразить доходы и расходы за период и получить прибыль или убыток","Показать оргструктуру","Оценить конкурентов"],"Compte de résultat = «фильм» за год: доходы − расходы = результат."]},
{id:115,t:"cas",a:2,fr:["La matrice BCG croise :",["Prix et qualité","Coûts et délais","Le taux de croissance du marché et la part de marché relative","Le nombre de salariés et le chiffre d'affaires"],"Axes BCG : croissance du marché × part de marché relative."],ru:["Матрица BCG сочетает:",["Цену и качество","Затраты и сроки","Темп роста рынка и относительную долю рынка","Число сотрудников и оборот"],"Оси BCG: рост рынка × относительная доля рынка."]},
{id:116,t:"cas",a:1,fr:["Quel groupe prend le contrôle de Lafuma en 2013-2014 ?",["LG Fashion","Calida","K2","Millet"],"Calida détient 59,92 % du capital en 2014."],ru:["Какая группа получила контроль над Lafuma в 2013–2014?",["LG Fashion","Calida","K2","Millet"],"Calida владеет 59,92% капитала в 2014."]},
{id:117,t:"cas",a:3,fr:["Chiffre d'affaires consolidé du groupe Lafuma en 2019 :",["16 M€","31 M€","228 M€","172,6 M€"],"172,6 M€ en 2019 (228 M€ en 2011, 16 M€ en 1980)."],ru:["Консолидированный оборот Lafuma в 2019:",["16 млн €","31 млн €","228 млн €","172,6 млн €"],"172,6 млн € в 2019 (228 млн в 2011, 16 млн в 1980)."]},
{id:118,t:"cas",a:0,fr:["Qu'est-ce qu'une étude de cas ?",["L'analyse d'une situation réelle d'entreprise pour poser un diagnostic et proposer des solutions argumentées","Un résumé de cours","Un test de mémoire","Un rapport financier officiel"],"Situation réelle → diagnostic → solutions justifiées."],ru:["Что такое кейс (étude de cas)?",["Анализ реальной ситуации компании для диагностики и обоснованных решений","Конспект курса","Тест на запоминание","Официальный финансовый отчёт"],"Реальная ситуация → диагноз → обоснованные решения."]},
{id:119,t:"cas",a:1,fr:["Quels sont les facteurs de production classiques d'une entreprise ?",["Les clients et les fournisseurs","Le travail et le capital","Les impôts et les taxes","La publicité et le marketing"],"Travail (salariés) + capital (machines, usines, marques)."],ru:["Классические факторы производства предприятия:",["Клиенты и поставщики","Труд и капитал","Налоги и сборы","Реклама и маркетинг"],"Труд (сотрудники) + капитал (оборудование, заводы, бренды)."]},
{id:120,t:"manager",a:1,fr:["Chez Mintzberg, le rôle de « porte-parole » appartient aux rôles :",["Interpersonnels","Informationnels","Décisionnels","Politiques"],"Porte-parole = transmet l'information à l'extérieur → informationnel."],ru:["У Минцберга роль «представителя» (porte-parole) относится к:",["Межличностным","Информационным","Решенческим","Политическим"],"Porte-parole передаёт информацию вовне → информационная роль."]},
{id:121,t:"manager",a:0,fr:["Le rôle de « figure de proue » (symbole) appartient aux rôles :",["Interpersonnels","Informationnels","Décisionnels","Financiers"],"Figure de proue, leader, agent de liaison = interpersonnels."],ru:["Роль «символа» (figure de proue) относится к:",["Межличностным","Информационным","Решенческим","Финансовым"],"Figure de proue, leader, agent de liaison = межличностные."]},
{id:122,t:"gm",a:1,fr:["L'efficience, c'est :",["Atteindre ses objectifs, peu importe le coût","Atteindre ses objectifs en minimisant les ressources utilisées","Avoir le plus de salariés possible","Augmenter ses prix"],"Efficience = rapport résultat / ressources."],ru:["Efficience (эффективность) — это:",["Достигать целей любой ценой","Достигать целей, минимизируя используемые ресурсы","Иметь как можно больше сотрудников","Повышать цены"],"Efficience = соотношение результата и ресурсов."]},
