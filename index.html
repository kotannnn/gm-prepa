<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4BFF">
<title>Révision Management L1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a planning board — grid-paper ground, the four PODC functions as the signature tiles, content in calm white sheets; bottom tab bar on phones. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#0F1A2B; --muted:#596476; --line:#D5DCE5; --grid:rgba(31,75,255,.07);
  --accent:#1F4BFF; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF;
  --hi:#FFD84D; --hi-ink:#1E1700;
  --ok:#0F8A55; --ok-bg:#E1F5EA; --bad:#C93434; --bad-bg:#FBE7E7; --warn:#9A5800; --warn-bg:#FDF0DC;
  --c-gm:#1F4BFF; --c-podc:#0A9586; --c-manager:#B26100; --c-leader:#D93D55; --c-gouv:#7446D4; --c-cas:#3A7636;
  --shadow:0 1px 0 rgba(15,26,43,.04),0 10px 28px -16px rgba(15,26,43,.28);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B111B; --surface:#141C29; --surface2:#1A2434; --ink:#E7ECF4; --muted:#97A2B5; --line:#283447; --grid:rgba(120,150,255,.06);
  --accent:#7590FF; --accent-ink:#0B111B; --accent-soft:#1D2848;
  --hi:#FFD84D; --hi-ink:#1E1700;
  --ok:#3FCB8A; --ok-bg:#12301F; --bad:#FF7373; --bad-bg:#3A1717; --warn:#FFB547; --warn-bg:#3A2A10;
  --c-gm:#7590FF; --c-podc:#2CC9B6; --c-manager:#FFAA3B; --c-leader:#FF6F86; --c-gouv:#A988FF; --c-cas:#7CC56F;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B111B; --surface:#141C29; --surface2:#1A2434; --ink:#E7ECF4; --muted:#97A2B5; --line:#283447; --grid:rgba(120,150,255,.06);
  --accent:#7590FF; --accent-ink:#0B111B; --accent-soft:#1D2848;
  --hi:#FFD84D; --hi-ink:#1E1700;
  --ok:#3FCB8A; --ok-bg:#12301F; --bad:#FF7373; --bad-bg:#3A1717; --warn:#FFB547; --warn-bg:#3A2A10;
  --c-gm:#7590FF; --c-podc:#2CC9B6; --c-manager:#FFAA3B; --c-leader:#FF6F86; --c-gouv:#A988FF; --c-cas:#7CC56F;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;min-height:100vh}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 .1em}
:root[data-theme="dark"] mark{background:linear-gradient(transparent 55%,rgba(255,216,77,.38) 55%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) mark{background:linear-gradient(transparent 55%,rgba(255,216,77,.38) 55%)}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;height:60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:700 15px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand-mark{display:grid;grid-template-columns:repeat(2,11px);gap:2px}
.brand-mark i{width:11px;height:11px;border-radius:3px;display:block}
.brand-mark i:nth-child(1){background:var(--c-gm)}.brand-mark i:nth-child(2){background:var(--c-podc)}
.brand-mark i:nth-child(3){background:var(--c-manager)}.brand-mark i:nth-child(4){background:var(--c-leader)}
.nav{display:flex;gap:2px;margin-left:8px}
.nav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px;padding:8px 12px;border-radius:10px}
.nav a:hover{color:var(--ink);background:var(--surface2)}
.nav a.on{color:var(--ink);background:var(--accent-soft)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.xp{display:flex;align-items:center;gap:6px;font:700 13px/1 var(--f-mono);padding:7px 10px;border-radius:999px;background:var(--hi);color:var(--hi-ink);white-space:nowrap}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}

/* bottom tabbar (mobile) */
.tabbar{display:none}
@media (max-width:960px){
  .nav{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;
    background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:6px 2px;border-radius:10px}
  .tabbar a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
  .tabbar a.on{color:var(--accent);background:var(--accent-soft)}
  .xp .xp-l{display:none}
}

main{max-width:1120px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:960px){main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}}

.view{animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* type */
.eyebrow{font:600 12px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.h1{font:800 clamp(28px,5.4vw,52px)/1.04 var(--f-display);letter-spacing:-.025em}
.h2{font:700 clamp(21px,3vw,28px)/1.15 var(--f-display);letter-spacing:-.015em}
.h3{font:700 17px/1.25 var(--f-body)}
.lead{font-size:17.5px;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:12px 18px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s;min-height:46px}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 11.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;
  padding:6px 9px;border-radius:7px;color:var(--tc,var(--accent));background:color-mix(in srgb,var(--tc,var(--accent)) 13%,transparent)}
.chip::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--tc,var(--accent))}

/* HOME */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:center;margin-bottom:34px}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:22px}}
.hero-t{display:flex;flex-direction:column;gap:16px;min-width:0}
.podc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;border:0;cursor:pointer;text-align:left;border-radius:16px;padding:16px;min-height:132px;color:#fff;
  background:var(--tc);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:transform .18s}
.tile:hover{transform:translateY(-2px) rotate(-.4deg)}
.tile .L{font:800 54px/.9 var(--f-display);letter-spacing:-.04em;opacity:.95}
.tile .n{font:700 14px/1.2 var(--f-body)}
.tile .d{font-size:13.5px;line-height:1.35;font-weight:500}
.tile .k{position:absolute;right:12px;top:12px;font:600 11px var(--f-mono);opacity:.75}
:root[data-theme="dark"] .tile{color:#0B111B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile{color:#0B111B}}
.podc-cap{grid-column:1/-1;font-size:13px;color:var(--muted);text-align:center}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:34px}
@media (max-width:820px){.stats{grid-template-columns:1fr 1fr}}
.stat{padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font:700 26px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--tc,var(--accent));border-radius:99px;transition:width .4s}

.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 14px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:38px}
.mode{display:flex;flex-direction:column;gap:10px;padding:18px;text-decoration:none;color:var(--ink);transition:transform .15s,border-color .15s;min-width:0}
.mode:hover{transform:translateY(-2px);border-color:var(--tc,var(--accent))}
.mode .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 15%,transparent)}
.mode .ic svg{width:24px;height:24px;stroke:var(--tc);fill:none;stroke-width:2}
.mode p{margin:0;font-size:14.5px;color:var(--muted)}
.mode .meta{margin-top:auto;font:600 12px var(--f-mono);color:var(--tc)}

.topics-prog{display:grid;gap:8px}
.tp{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:14px;align-items:center;padding:12px 16px;text-decoration:none;color:var(--ink)}
.tp:hover{border-color:var(--tc)}
.tp .mono{text-align:right;font-size:14px}
@media (max-width:520px){.tp{grid-template-columns:minmax(0,1fr) 70px 44px;gap:10px}}

/* COURS */
.cours{display:grid;grid-template-columns:260px minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:900px){.cours{grid-template-columns:1fr}}
.toc{position:sticky;top:84px;display:flex;flex-direction:column;gap:4px;padding:10px}
.toc a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:600;font-size:14.5px;line-height:1.25}
.toc a i{width:10px;height:10px;border-radius:3px;background:var(--tc);flex:none}
.toc a:hover{background:var(--surface2)}
.toc a.on{background:color-mix(in srgb,var(--tc) 14%,transparent)}
@media (max-width:900px){
  .toc{position:static;flex-direction:row;overflow-x:auto;padding:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .toc::-webkit-scrollbar{display:none}
  .toc a{white-space:nowrap;flex:none}
}
.art{padding:clamp(18px,3.4vw,38px);min-width:0}
.art-h{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;border-bottom:1px dashed var(--line);margin-bottom:22px}
.art-h .chip{align-self:flex-start}
.art section{margin-bottom:26px}
.art section h3{font:700 18px/1.3 var(--f-body);margin-bottom:8px;display:flex;gap:10px;align-items:baseline}
.art section h3 small{font:600 12px var(--f-mono);color:var(--tc)}
.art p,.art li{max-width:68ch}
.art p{margin:0 0 10px}
.art ul{margin:0 0 10px;padding-left:20px}
.art li{margin-bottom:6px}
.art li::marker{color:var(--tc)}
.tbl-wrap{overflow-x:auto;margin:6px 0 14px;border:1px solid var(--line);border-radius:10px}
.tbl{border-collapse:collapse;width:100%;font-size:14.5px;min-width:440px}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--surface2);font-weight:700}
.tbl tr:last-child td{border-bottom:0}
.facts{border-radius:14px;padding:18px 18px 8px;background:color-mix(in srgb,var(--hi) 22%,var(--surface));border:1px solid color-mix(in srgb,var(--hi) 70%,var(--line));margin-bottom:18px}
:root[data-theme="dark"] .facts{background:color-mix(in srgb,var(--hi) 9%,var(--surface))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .facts{background:color-mix(in srgb,var(--hi) 9%,var(--surface))}}
.facts h3,.traps h3{font:700 13px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px}
.facts ol{margin:0;padding:0;list-style:none;counter-reset:f}
.facts li{counter-increment:f;display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;margin-bottom:10px;max-width:none}
.facts li::before{content:counter(f);font:700 12px/22px var(--f-mono);text-align:center;width:24px;height:22px;border-radius:6px;background:var(--hi);color:var(--hi-ink)}
.traps{border-radius:14px;padding:18px 18px 8px;background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line));margin-bottom:18px}
.traps h3{color:var(--bad)}
.traps ul{margin:0;padding-left:18px}
.traps li{margin-bottom:8px}
.art-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;padding-top:18px;border-top:1px dashed var(--line)}

/* QCM select */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pick{display:flex;flex-direction:column;gap:10px;padding:18px;text-align:left;cursor:pointer;border:1px solid var(--line);transition:transform .15s,border-color .15s;min-width:0}
.pick:hover{transform:translateY(-2px);border-color:var(--tc,var(--accent))}
.pick .h3{color:var(--ink)}
.pick .muted{font-size:14px}
.pick[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.pick.special{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pick.special .h3,.pick.special .muted{color:inherit}
.pick.special .muted{opacity:.75}

/* quiz */
.quiz{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qtop .bar{flex:1 1 160px}
.qcard{padding:clamp(18px,3.4vw,30px);display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.qtext{font:600 clamp(18px,2.4vw,21px)/1.4 var(--f-body)}
.orig{display:block;font-size:13.5px;font-weight:500;color:var(--muted);margin-top:4px;font-style:italic}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;text-align:left;cursor:pointer;
  border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.4;transition:border-color .15s,background .15s,transform .1s;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .key{font:700 13px/30px var(--f-mono);text-align:center;width:30px;height:30px;border-radius:8px;background:var(--surface2);border:1px solid var(--line)}
.opt[disabled]{cursor:default;opacity:1}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
.opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.expl{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface2);font-size:15px}
.expl b.okt{color:var(--ok)} .expl b.badt{color:var(--bad)}
.qfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{font:600 12px var(--f-mono);color:var(--muted)}
@media (hover:none){.kbd{display:none}}

/* result */
.result{max-width:640px;margin:0 auto;padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .bg{stroke:var(--surface2)}
.ring .fg{stroke:var(--tc,var(--accent));stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 30px var(--f-display)}
.review{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;background:var(--surface)}
.rv .q{font-weight:600;margin-bottom:6px}
.rv .a-ok{color:var(--ok);font-weight:600}
.rv .a-bad{color:var(--bad);text-decoration:line-through}

/* exam */
.exam-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:start}
@media (max-width:860px){.exam-grid{grid-template-columns:1fr}}
.dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px}
.dots button{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;font:700 13px var(--f-mono);cursor:pointer;color:var(--muted)}
.dots button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dots button.cur{outline:2px solid var(--ink);outline-offset:1px}
@media (max-width:860px){.dots{grid-template-columns:repeat(10,1fr);order:-1}}
.timer{font:700 18px var(--f-mono);padding:8px 14px;border-radius:10px;background:var(--ink);color:var(--surface);font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad);color:#fff}
.note{font:800 clamp(52px,10vw,84px)/1 var(--f-display);letter-spacing:-.04em}
.note small{font-size:.38em;color:var(--muted)}
.callout{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;background:var(--surface2)}

/* flashcards */
.flash-wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.flash{perspective:1200px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:center}
.flash-in{position:relative;min-height:290px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.face.front{background:var(--surface)}
.face.back{background:var(--ink);color:var(--surface);transform:rotateY(180deg)}
.face .term{font:700 clamp(22px,4vw,30px)/1.2 var(--f-display);letter-spacing:-.02em}
.face .def{font-size:17px;line-height:1.5;max-width:46ch}
.face .hint{font:600 12px var(--f-mono);opacity:.6;text-transform:uppercase;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){.flash.flip .face.front{visibility:hidden}.flash.flip .face.back{transform:none}}

/* eclair */
.eclair{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ec-hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ec-hud .sheet{padding:12px;text-align:center}
.ec-hud b{display:block;font:700 24px var(--f-mono)}
.ec-hud span{font-size:12px;color:var(--muted)}
.statement{padding:30px 24px;min-height:190px;display:grid;place-items:center;text-align:center;font:600 clamp(19px,3vw,23px)/1.4 var(--f-body)}
.statement.flash-ok{animation:pulseok .4s}.statement.flash-bad{animation:pulsebad .4s}
@keyframes pulseok{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes pulsebad{0%{box-shadow:0 0 0 0 var(--bad)}100%{box-shadow:0 0 0 14px transparent}}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .btn{min-height:68px;font-size:19px}
.vf .v{background:var(--ok);border-color:var(--ok);color:#fff}
.vf .f{background:var(--bad);border-color:var(--bad);color:#fff}
.timebar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.timebar i{display:block;height:100%;background:var(--hi);transition:width 1s linear}

/* associer */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mitem{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-size:14.5px;line-height:1.35;min-height:56px;color:var(--ink);transition:border-color .15s,background .15s,opacity .3s}
.mitem.term{font-weight:700}
.mitem:hover:not([disabled]){border-color:var(--accent)}
.mitem.sel{border-color:var(--accent);background:var(--accent-soft)}
.mitem.done{border-color:var(--ok);background:var(--ok-bg);opacity:.6;cursor:default}
.mitem.err{animation:shake .35s;border-color:var(--bad)}
@media (max-width:520px){.mitem{font-size:13.5px;padding:10px}}

/* trier */
.sort{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sitem{padding:28px 22px;text-align:center;font:600 clamp(18px,3vw,22px)/1.4 var(--f-body);min-height:150px;display:grid;place-items:center}
.bins{display:grid;gap:10px}
.bins.n2{grid-template-columns:1fr 1fr}.bins.n3{grid-template-columns:repeat(3,1fr)}.bins.n4{grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.bins.n4{grid-template-columns:repeat(4,1fr)}}
@media (max-width:480px){.bins.n3{grid-template-columns:1fr}}
.bin{min-height:64px;border-radius:14px;border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--surface));color:var(--ink);font-weight:700;cursor:pointer;padding:10px;font-size:15px}
.bin:hover{background:color-mix(in srgb,var(--tc) 22%,var(--surface))}
.fb{border-radius:12px;padding:12px 14px;font-size:15px;text-align:center}
.fb.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.fb.bad{background:var(--bad-bg);color:var(--bad);font-weight:700}

/* focus banner (home, games hub) */
.focus{display:flex;align-items:center;gap:14px;padding:16px 18px;text-decoration:none;color:var(--ink);margin-bottom:34px;border-color:color-mix(in srgb,var(--tc) 45%,var(--line));transition:transform .15s}
.focus:hover{transform:translateY(-2px)}
.focus .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--tc) 15%,transparent)}
.focus .ic svg{width:24px;height:24px;stroke:var(--tc);fill:none;stroke-width:2}
.focus-t{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.focus-t .muted{font-size:14.5px}
.focus .btn{flex:none}
.focus.feat{margin-bottom:0;padding:22px}
@media (max-width:560px){.focus{flex-wrap:wrap}.focus .btn{width:100%}}

/* analyse */
.ana{display:flex;flex-direction:column;gap:30px}
.ana-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.ana-list{grid-template-columns:1fr}}
.ana-row{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center}
.ana-row .full{grid-column:1/-1}
.ana-row .pct{font:700 26px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.ana-row .meta{font-size:12.5px;color:var(--muted)}
.ana-row .adv{margin:0;font-size:14.5px}
.tbar{position:relative;height:10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.tbar i{display:block;height:100%;border-radius:99px;background:var(--tc)}
.tbar .goal{position:absolute;top:-5px;bottom:-5px;left:80%;width:2px;border-radius:2px;background:var(--ink);opacity:.45}
.pill{display:inline-flex;gap:5px;align-items:center;font:700 12px/1 var(--f-body);padding:6px 9px;border-radius:99px;white-space:nowrap}
.pill.s0{background:var(--surface2);color:var(--muted)}
.pill.s1{background:var(--bad-bg);color:var(--bad)}
.pill.s2{background:var(--warn-bg);color:var(--warn)}
.pill.s3{background:var(--ok-bg);color:var(--ok)}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.charts{grid-template-columns:1fr}}
.chart-card{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.chart{padding-top:24px}
.plot{position:relative;height:140px;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--line)}
.cbar{position:relative;flex:1 1 0;max-width:40px;height:100%;display:flex;align-items:flex-end;cursor:default;border-radius:4px}
.cbar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.cbar:hover i,.cbar:focus i{filter:brightness(1.15)}
.cbar b{position:absolute;left:50%;transform:translateX(-50%);font:700 12px var(--f-mono);color:var(--ink);white-space:nowrap}
.cbar:hover::after,.cbar:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);font:600 12px var(--f-mono);padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:3;pointer-events:none}
.cbar:first-child:hover::after,.cbar:first-child:focus::after{left:0;transform:none}
.ref{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--muted);opacity:.8;pointer-events:none;z-index:1}
.ref em{position:absolute;right:0;bottom:3px;font:600 11px var(--f-mono);font-style:normal;color:var(--muted)}

.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tagbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.tagbtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);pointer-events:none;animation:rise .25s}
@media (min-width:961px){.toast{bottom:28px}}
footer.foot{max-width:1120px;margin:0 auto;padding-block:0 30px;font-size:13px;color:var(--muted);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:960px){footer.foot{padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}}
</style>

<script>
"use strict";
/* ================= DATA ================= */
const TOPICS = [
{id:"gm",fr:{t:"Gestion & management",s:"Définitions, dimensions, efficacité / efficience"},ru:{t:"Управление (gestion) и менеджмент",s:"Определения, уровни, результативность / эффективность"},
 body:{
 fr:[
  {h:"La gestion",x:"<p>La <mark>gestion</mark> consiste à <b>utiliser de manière pertinente les ressources disponibles</b> (humaines, financières, matérielles, informationnelles) <b>afin d'atteindre les objectifs fixés</b>.</p><ul><li>Elle concerne <b>toutes les organisations</b> : entreprises, institutions publiques et organisations à but non lucratif (associations).</li><li>Temporalité : <b>le court et le moyen terme</b>, avec des <b>processus, des budgets et des indicateurs</b>.</li><li>Exemples typiques : établir un budget, contrôler les dépenses, planifier les stocks, suivre l'écart entre ventes prévues et réalisées.</li></ul>"},
  {h:"Le management",x:"<p>Le <mark>management</mark> rassemble <b>les techniques permettant de planifier, d'organiser, de diriger et de contrôler</b> les activités d'une entreprise.</p><ul><li>Il recouvre <b>deux éléments essentiels : la direction et la gestion</b>.</li><li>Le management <b>englobe la gestion</b>, tout en accordant <b>davantage d'importance au leadership et à la mobilisation des personnes</b>.</li><li>Il traite la dimension humaine : motiver, régler les conflits, donner du sens, accompagner le changement.</li></ul>"},
  {h:"Deux dimensions",x:"<div class='tbl-wrap'><table class='tbl'><tr><th></th><th>Management stratégique</th><th>Management opérationnel</th></tr><tr><td><b>Rôle</b></td><td>Création, mise en place et suivi d'une stratégie</td><td>Mettre en œuvre concrètement les décisions stratégiques à travers des plans d'action</td></tr><tr><td><b>Horizon</b></td><td>Long terme</td><td>Court / moyen terme</td></tr><tr><td><b>Qui ?</b></td><td>Direction générale</td><td>Managers de proximité, chefs d'équipe</td></tr></table></div>"},
  {h:"Efficacité et efficience",x:"<ul><li><mark>Efficacité</mark> : atteindre les objectifs.</li><li><mark>Efficience</mark> : atteindre les objectifs en utilisant le moins de ressources possible.</li><li>Rechercher les deux à la fois = <b>atteindre les objectifs en utilisant les ressources de manière maîtrisée</b>.</li></ul>"},
  {h:"Pourquoi la gestion est stratégique",x:"<p>La gestion <b>contribue à la performance, à la compétitivité et à la pérennité</b> de l'organisation. Elle ne garantit pas automatiquement la réussite et ne remplace pas la direction générale.</p><p><b>Limite de la gestion seule :</b> les procédures sont respectées, les indicateurs suivis… mais les salariés ne comprennent pas le sens de leur travail et se désengagent. Il faut alors renforcer le <b>management</b>.</p>"}
 ],
 ru:[
  {h:"Управление (la gestion)",x:"<p><mark>Gestion</mark> — это <b>грамотное использование имеющихся ресурсов</b> (человеческих, финансовых, материальных, информационных) <b>для достижения поставленных целей</b>.</p><ul><li>Касается <b>всех организаций</b>: предприятий, государственных учреждений и некоммерческих организаций (ассоциаций).</li><li>Горизонт: <b>краткосрочный и среднесрочный</b>, через <b>процессы, бюджеты и показатели</b> (processus, budgets, indicateurs).</li><li>Типичные примеры: составить бюджет, контролировать расходы, планировать запасы, сравнить план продаж с фактом.</li></ul>"},
  {h:"Менеджмент (le management)",x:"<p><mark>Management</mark> — это <b>совокупность техник, позволяющих планировать, организовывать, руководить и контролировать</b> деятельность предприятия (planifier, organiser, diriger, contrôler).</p><ul><li>Включает <b>два ключевых элемента: руководство и управление ресурсами (direction et gestion)</b>.</li><li>Менеджмент <b>шире, чем gestion</b>: он включает её, но делает <b>больший акцент на лидерстве и мобилизации людей</b>.</li><li>Человеческое измерение: мотивировать, решать конфликты, давать смысл работе, сопровождать изменения.</li></ul>"},
  {h:"Два уровня",x:"<div class='tbl-wrap'><table class='tbl'><tr><th></th><th>Стратегический (stratégique)</th><th>Операционный (opérationnel)</th></tr><tr><td><b>Роль</b></td><td>Создание, внедрение и сопровождение стратегии</td><td>Конкретно реализовать стратегические решения через планы действий (plans d'action)</td></tr><tr><td><b>Горизонт</b></td><td>Долгосрочный</td><td>Кратко- / среднесрочный</td></tr><tr><td><b>Кто?</b></td><td>Высшее руководство</td><td>Линейные менеджеры, руководители групп</td></tr></table></div>"},
  {h:"Результативность и эффективность",x:"<ul><li><mark>Efficacité</mark> (результативность): достигать целей.</li><li><mark>Efficience</mark> (эффективность): достигать целей, тратя как можно меньше ресурсов.</li><li>Обе сразу = <b>достигать целей при контролируемом расходе ресурсов</b>.</li></ul>"},
  {h:"Почему gestion важна стратегически",x:"<p>Gestion <b>способствует результативности (performance), конкурентоспособности и долговечности (pérennité)</b> организации. Она НЕ гарантирует автоматически успех и НЕ заменяет высшее руководство.</p><p><b>Предел «чистой» gestion:</b> процедуры соблюдаются, показатели отслеживаются… но сотрудники не понимают смысла своей работы и теряют вовлечённость. Тогда нужно усиливать <b>менеджмент</b>.</p>"}
 ]},
 facts:{fr:["Gestion = utiliser de manière pertinente les ressources pour atteindre les objectifs fixés.","Management = planifier, organiser, diriger, contrôler. Il recouvre direction + gestion.","Le management englobe la gestion et insiste sur le leadership et la mobilisation des personnes.","Management stratégique = stratégie à long terme ; opérationnel = plans d'action concrets.","La gestion concerne entreprises, institutions publiques et organisations à but non lucratif.","Gestion → court et moyen terme, processus, budgets, indicateurs.","Efficacité + efficience = objectifs atteints avec des ressources maîtrisées.","La gestion contribue à la performance, la compétitivité et la pérennité."],
        ru:["Gestion = грамотно использовать ресурсы для достижения поставленных целей.","Management = планировать, организовывать, руководить, контролировать. Включает direction + gestion.","Менеджмент включает gestion и делает акцент на лидерстве и мобилизации людей.","Стратегический менеджмент = стратегия на долгий срок; операционный = конкретные планы действий.","Gestion касается предприятий, госучреждений и некоммерческих организаций.","Gestion → кратко- и среднесрочный горизонт, процессы, бюджеты, показатели.","Efficacité + efficience = цели достигнуты при контролируемых ресурсах.","Gestion способствует performance, compétitivité и pérennité."]},
 traps:{fr:["« Gestion et management sont synonymes » → FAUX.","« La gestion concerne seulement les entreprises commerciales » → FAUX.","« La gestion garantit automatiquement la réussite » → FAUX.","Motivation, résistance au changement → c'est le management, pas la gestion matérielle."],
        ru:["«Gestion и management — синонимы» → НЕВЕРНО.","«Gestion касается только коммерческих предприятий» → НЕВЕРНО.","«Gestion автоматически гарантирует успех» → НЕВЕРНО.","Мотивация, сопротивление изменениям → это менеджмент, а не материальное управление."]}},

{id:"podc",fr:{t:"Les fonctions : P·O·D·C",s:"Planifier, organiser, diriger, contrôler, coordonner"},ru:{t:"Функции: P·O·D·C",s:"Планировать, организовать, руководить, контролировать"},
 body:{
 fr:[
  {h:"Le cycle du management",x:"<p>Hérité d'<b>Henri Fayol</b> (prévoir, organiser, commander, coordonner, contrôler), le cours retient <mark>4 fonctions</mark> : <b>Planification → Organisation → Direction → Contrôle</b>, plus la <b>coordination</b> qui relie l'ensemble.</p><div class='tbl-wrap'><table class='tbl'><tr><th>Fonction</th><th>Rôle</th></tr><tr><td><b>Planification</b></td><td>Définir les objectifs et prévoir les actions</td></tr><tr><td><b>Organisation</b></td><td>Répartir les tâches, attribuer les responsabilités, allouer les ressources</td></tr><tr><td><b>Direction</b></td><td>Animer : former, fixer les objectifs individuels, communiquer, motiver, évaluer</td></tr><tr><td><b>Contrôle</b></td><td>Comparer les résultats aux objectifs et apporter des corrections</td></tr></table></div>"},
  {h:"Planification",x:"<ul><li><b>Tous les managers planifient</b>, même si le <b>degré de formalisation varie</b> (pas besoin d'un plan écrit pour planifier).</li><li>Elle <b>facilite le contrôle</b> : elle définit des <b>objectifs et des normes</b> permettant d'évaluer les performances.</li><li>Risque : un plan qui fixe tout précisément dans un environnement qui change brutalement → <mark>rigidité</mark>, l'organisation ne s'adapte plus.</li></ul>"},
  {h:"Organisation et coordination",x:"<ul><li>Une bonne organisation permet de <b>clarifier les rôles, répartir les responsabilités et faciliter le flux de travail</b>.</li><li>La <mark>coordination</mark> vise à <b>synchroniser les activités et les efforts</b> afin d'éviter <b>les doublons, les retards et les conflits</b>.</li></ul>"},
  {h:"Direction (animation)",x:"<p>Activités d'animation du manager : <b>former, fixer les objectifs individuels, communiquer, motiver et évaluer</b>. C'est la fonction la plus humaine, liée au leadership.</p>"},
  {h:"Contrôle",x:"<ul><li>Le contrôle n'est <b>pas une simple surveillance</b> ni une sanction : il <b>compare les résultats aux objectifs</b> et <b>engage des actions correctives</b>.</li><li>Séquence correcte : <mark>Contrôle → correction</mark>.</li><li>Planification et contrôle sont <b>complémentaires</b> : définir des objectifs → mesurer les résultats → corriger les écarts.</li><li>Contrôler les résultats et mobiliser les hommes <b>fait partie</b> du rôle du manager.</li></ul>"}
 ],
 ru:[
  {h:"Цикл менеджмента",x:"<p>Идея восходит к <b>Анри Файолю</b> (prévoir, organiser, commander, coordonner, contrôler). В курсе — <mark>4 функции</mark>: <b>Планирование → Организация → Руководство → Контроль</b> и <b>координация</b>, которая связывает всё вместе.</p><div class='tbl-wrap'><table class='tbl'><tr><th>Функция</th><th>Роль</th></tr><tr><td><b>Planification</b></td><td>Определить цели и предусмотреть действия</td></tr><tr><td><b>Organisation</b></td><td>Распределить задачи, ответственность и ресурсы</td></tr><tr><td><b>Direction</b></td><td>Вести людей: обучать, ставить индивидуальные цели, общаться, мотивировать, оценивать</td></tr><tr><td><b>Contrôle</b></td><td>Сравнить результаты с целями и внести исправления</td></tr></table></div>"},
  {h:"Планирование (planification)",x:"<ul><li><b>Все менеджеры планируют</b>, даже если <b>степень формализации разная</b> (не обязательно писать формальный план).</li><li>Планирование <b>облегчает контроль</b>: задаёт <b>цели и нормы</b> для оценки результатов.</li><li>Риск: план, жёстко фиксирующий все действия, при резко меняющейся среде → <mark>rigidité</mark> (жёсткость), организация не успевает адаптироваться.</li></ul>"},
  {h:"Организация и координация",x:"<ul><li>Хорошая организация позволяет <b>прояснить роли, распределить ответственность и облегчить поток работы</b>.</li><li><mark>Coordination</mark> = <b>синхронизировать действия и усилия</b>, чтобы избежать <b>дублирования, задержек и конфликтов</b>.</li></ul>"},
  {h:"Руководство (direction / animation)",x:"<p>Действия менеджера по «animation»: <b>обучать, ставить индивидуальные цели, общаться, мотивировать и оценивать</b>. Самая «человеческая» функция, связана с лидерством.</p>"},
  {h:"Контроль (contrôle)",x:"<ul><li>Контроль — это <b>не просто надзор</b> и не наказание: он <b>сравнивает результаты с целями</b> и <b>запускает корректирующие действия</b>.</li><li>Правильная последовательность: <mark>Contrôle → correction</mark>.</li><li>Планирование и контроль <b>дополняют друг друга</b>: поставить цели → измерить результаты → исправить отклонения (écarts).</li><li>Контролировать результаты и мобилизовать людей — <b>это задача</b> менеджера.</li></ul>"}
 ]},
 facts:{fr:["Planification = définir les objectifs et prévoir les actions.","Organisation = répartir tâches, responsabilités et ressources.","Direction = former, fixer les objectifs individuels, communiquer, motiver, évaluer.","Contrôle = comparer les résultats aux objectifs + actions correctives (pas une simple surveillance).","Coordination = synchroniser pour éviter doublons, retards, conflits.","Tous les managers planifient ; seul le degré de formalisation varie.","La planification facilite le contrôle (objectifs + normes).","Plan trop précis + environnement instable = rigidité."],
        ru:["Planification = определить цели и предусмотреть действия.","Organisation = распределить задачи, ответственность и ресурсы.","Direction = обучать, ставить индивидуальные цели, общаться, мотивировать, оценивать.","Contrôle = сравнить результаты с целями + корректирующие действия (не просто надзор).","Coordination = синхронизация, чтобы избежать дублей, задержек, конфликтов.","Все менеджеры планируют; различается лишь степень формализации.","Планирование облегчает контроль (цели + нормы).","Слишком детальный план + нестабильная среда = жёсткость (rigidité)."]},
 traps:{fr:["« Direction : comparer les résultats aux objectifs » → INCORRECT, c'est le contrôle.","« Le contrôle intervient avant la définition des objectifs » → FAUX.","« Seuls ceux qui rédigent un plan formel planifient » → FAUX.","« Ce n'est pas au manager de contrôler et mobiliser » → FAUX."],
        ru:["«Direction: сравнивать результаты с целями» → НЕВЕРНО, это контроль.","«Контроль происходит до постановки целей» → НЕВЕРНО.","«Планируют только те, кто пишет формальный план» → НЕВЕРНО.","«Контроль и мобилизация людей — не задача менеджера» → НЕВЕРНО."]}},

{id:"manager",fr:{t:"Le manager : rôles & compétences",s:"Mintzberg, compétences technique, humaine, conceptuelle, politique"},ru:{t:"Менеджер: роли и компетенции",s:"Минцберг, технические, человеческие, концептуальные, политические компетенции"},
 body:{
 fr:[
  {h:"Qui est le manager ?",x:"<p>Le manager est celui qui <mark>mobilise les ressources d'autres individus</mark> et <b>transforme les compétences individuelles en performance collective</b>. Il n'exécute pas tout lui-même.</p><ul><li>Budget, dépenses, stocks → activité de <b>gestion</b>.</li><li>Motiver, régler un conflit, accompagner une transformation → fonction de <b>management</b>.</li></ul>"},
  {h:"Les 10 rôles de Mintzberg",x:"<div class='tbl-wrap'><table class='tbl'><tr><th>Famille</th><th>Rôles</th><th>Idée</th></tr><tr><td><b>Interpersonnels</b></td><td>Figure de proue (symbole), leader, agent de liaison</td><td>Relations avec les personnes</td></tr><tr><td><b>Informationnels</b></td><td>Observateur actif, diffuseur, porte-parole</td><td>Collecter, analyser, transmettre l'information</td></tr><tr><td><b>Décisionnels</b></td><td>Entrepreneur, régulateur, répartiteur de ressources, négociateur</td><td>Prendre des décisions</td></tr></table></div><p>Exemple : un manager qui <b>collecte, analyse et transmet</b> des informations aux services exerce des <b>rôles informationnels</b>.</p>"},
  {h:"Les compétences du manager",x:"<ul><li><mark>Technique</mark> : maîtrise du métier, des outils et méthodes.</li><li><mark>Humaine / interpersonnelle</mark> : travailler avec les autres, communiquer, motiver.</li><li><mark>Conceptuelle</mark> : <b>analyser des situations complexes et prendre des décisions appropriées</b>, vision d'ensemble.</li><li><mark>Politique</mark> : <b>développer une influence et obtenir les soutiens nécessaires</b> au développement de ses activités (réseau, alliances).</li></ul>"}
 ],
 ru:[
  {h:"Кто такой менеджер?",x:"<p>Менеджер — тот, кто <mark>мобилизует ресурсы других людей</mark> и <b>превращает индивидуальные компетенции в коллективный результат</b>. Он не выполняет всё сам.</p><ul><li>Бюджет, расходы, запасы → деятельность по <b>gestion</b>.</li><li>Мотивировать, решить конфликт, сопровождать трансформацию → функция <b>management</b>.</li></ul>"},
  {h:"10 ролей Минцберга",x:"<div class='tbl-wrap'><table class='tbl'><tr><th>Группа</th><th>Роли</th><th>Суть</th></tr><tr><td><b>Межличностные (interpersonnels)</b></td><td>Символ / «лицо» (figure de proue), лидер, связующее звено (agent de liaison)</td><td>Отношения с людьми</td></tr><tr><td><b>Информационные (informationnels)</b></td><td>Наблюдатель (observateur), распространитель (diffuseur), представитель (porte-parole)</td><td>Собирать, анализировать, передавать информацию</td></tr><tr><td><b>Решенческие (décisionnels)</b></td><td>Предприниматель, регулятор (régulateur), распределитель ресурсов, переговорщик</td><td>Принимать решения</td></tr></table></div><p>Пример: менеджер, который <b>собирает, анализирует и передаёт</b> информацию службам, выполняет <b>информационные роли</b>.</p>"},
  {h:"Компетенции менеджера",x:"<ul><li><mark>Техническая (technique)</mark>: владение профессией, инструментами и методами.</li><li><mark>Человеческая / межличностная (humaine)</mark>: работать с людьми, общаться, мотивировать.</li><li><mark>Концептуальная (conceptuelle)</mark>: <b>анализировать сложные ситуации и принимать адекватные решения</b>, видеть картину целиком.</li><li><mark>Политическая (politique)</mark>: <b>развивать влияние и получать поддержку</b>, необходимую для развития своей деятельности (связи, альянсы).</li></ul>"}
 ]},
 facts:{fr:["Manager = mobilise les ressources des autres et transforme les compétences individuelles en performance collective.","Rôles interpersonnels : figure de proue, leader, agent de liaison.","Rôles informationnels : observateur, diffuseur, porte-parole.","Rôles décisionnels : entrepreneur, régulateur, répartiteur de ressources, négociateur.","Compétence conceptuelle = analyser des situations complexes et décider.","Compétence politique = influence + obtenir les soutiens nécessaires.","Budget / dépenses / stocks = gestion ; motiver / conflit / changement = management."],
        ru:["Менеджер = мобилизует ресурсы других и превращает индивидуальные компетенции в коллективный результат.","Межличностные роли: figure de proue, leader, agent de liaison.","Информационные роли: observateur, diffuseur, porte-parole.","Решенческие роли: entrepreneur, régulateur, répartiteur de ressources, négociateur.","Концептуальная компетенция = анализ сложных ситуаций и принятие решений.","Политическая компетенция = влияние + получение нужной поддержки.","Бюджет / расходы / запасы = gestion; мотивация / конфликт / изменения = management."]},
 traps:{fr:["Ne pas confondre : « figure de proue, leader, agent de liaison » = interpersonnels, PAS décisionnels.","Collecter + transmettre l'information = informationnels, PAS décisionnels.","Sur la copie scannée, les réponses cochées aux questions 33 et 34 sont fausses d'après Mintzberg. Le site donne la bonne réponse."],
        ru:["Не путать: «figure de proue, leader, agent de liaison» = межличностные, НЕ решенческие.","Собирать + передавать информацию = информационные роли, НЕ решенческие.","В отсканированной работе в вопросах 33 и 34 отмечены неверные ответы (по Минцбергу). На сайте дан правильный вариант."]}},

{id:"leader",fr:{t:"Leadership & styles",s:"Leader vs manager, leadership situationnel, cas Steve Jobs"},ru:{t:"Лидерство и стили",s:"Лидер vs менеджер, ситуационное лидерство, кейс Стива Джобса"},
 body:{
 fr:[
  {h:"Définir le leadership",x:"<p>Le <mark>leadership</mark> est <b>la capacité à influencer et fédérer un groupe autour d'un but commun, dans une relation de confiance</b>. Ce n'est pas un pouvoir hiérarchique imposé.</p><ul><li>On peut être <b>leader sans être manager</b> : leader <b>expert, stratège, rénovateur ou coach</b>.</li><li>Le leadership est <b>limité dans le temps</b> : l'influence du leader dépend <b>des situations, de l'environnement et de la reconnaissance du groupe</b>.</li><li><mark>Humilité et leadership situationnel</mark> : le manager peut s'effacer temporairement au profit d'un collaborateur plus compétent sur un sujet précis.</li></ul>"},
  {h:"Manager ou leader ?",x:"<div class='tbl-wrap'><table class='tbl'><tr><th>Manager</th><th>Leader</th></tr><tr><td>Pouvoir lié à la position hiérarchique</td><td>Pouvoir reconnu par le groupe</td></tr><tr><td>Gère les ressources, les procédures, les résultats</td><td>Donne une vision, inspire, entraîne</td></tr><tr><td>Planifie, organise, contrôle</td><td>Influence, fédère, crée la confiance</td></tr></table></div>"},
  {h:"Les styles de management",x:"<ul><li><b>Autoritaire / directif</b> : le manager décide seul et contrôle.</li><li><b>Persuasif (paternaliste)</b> : il décide mais explique et convainc.</li><li><b>Participatif</b> : il associe l'équipe aux décisions.</li><li><b>Délégatif</b> : il confie la décision aux collaborateurs autonomes.</li></ul><p>Le style doit être choisi <mark>en fonction de l'influence du manager, des subordonnés et du contexte</mark>, pas seulement de la personnalité ou du rang.</p>"},
  {h:"Étude de cas : Steve Jobs",x:"<ul><li>Style <b>autoritaire et directif</b>, <b>obsédé par le contrôle</b>, perfectionniste, impatient, colérique.</li><li><b>« Culture du oui »</b> : il était déconseillé de ne pas approuver les décisions.</li><li><b>Dévouement à la marque</b> : disponibilité 24h/24, 7j/7 ; « Worldwide loyalty team » pour détecter le personnel déviant.</li><li>Projets en <b>vase clos</b> : équipes isolées, contrôle « jusqu'au bout des ongles ».</li><li>Renvoyé de sa propre firme en <b>1985</b> pour avoir ignoré l'avis des actionnaires et partenaires.</li><li><b>Avantages</b> : vision forte, exigence de qualité, innovation, confidentialité, rapidité de décision.</li><li><b>Inconvénients</b> : pression constante, stress, fatigue physique et morale, peur, créativité bridée, turnover.</li><li><b>Leader ou manager ?</b> Leader charismatique et visionnaire, mais manager autoritaire. On retiendrait l'exigence et la vision, pas la peur.</li></ul>"}
 ],
 ru:[
  {h:"Что такое лидерство",x:"<p><mark>Leadership</mark> — это <b>способность влиять на группу и объединять её вокруг общей цели в отношениях доверия</b>. Это не навязанная иерархическая власть.</p><ul><li>Можно быть <b>лидером, не будучи менеджером</b>: лидер-<b>эксперт, стратег, реформатор (rénovateur) или коуч</b>.</li><li>Лидерство <b>ограничено во времени</b>: влияние лидера зависит <b>от ситуации, среды и признания группой</b>.</li><li><mark>Скромность и ситуационное лидерство</mark>: менеджер может временно уступить роль более компетентному в конкретном вопросе сотруднику.</li></ul>"},
  {h:"Менеджер или лидер?",x:"<div class='tbl-wrap'><table class='tbl'><tr><th>Менеджер</th><th>Лидер</th></tr><tr><td>Власть от должности</td><td>Власть признана группой</td></tr><tr><td>Управляет ресурсами, процедурами, результатами</td><td>Даёт видение, вдохновляет, ведёт</td></tr><tr><td>Планирует, организует, контролирует</td><td>Влияет, объединяет, создаёт доверие</td></tr></table></div>"},
  {h:"Стили менеджмента",x:"<ul><li><b>Авторитарный / директивный (autoritaire, directif)</b>: решает сам и контролирует.</li><li><b>Убеждающий (persuasif, paternaliste)</b>: решает сам, но объясняет и убеждает.</li><li><b>Партисипативный (participatif)</b>: вовлекает команду в решения.</li><li><b>Делегирующий (délégatif)</b>: передаёт решения самостоятельным сотрудникам.</li></ul><p>Стиль выбирают <mark>в зависимости от влияния менеджера, подчинённых и контекста</mark>, а не только от характера или должности.</p>"},
  {h:"Кейс: Стив Джобс",x:"<ul><li>Стиль <b>авторитарный и директивный</b>, <b>одержимость контролем</b>, перфекционизм, нетерпеливость, вспыльчивость.</li><li><b>«Культура да» (culture du oui)</b>: не соглашаться с решениями компании не рекомендовалось.</li><li><b>Преданность бренду</b>: доступность 24/7; «Worldwide loyalty team» для выявления «неблагонадёжных».</li><li>Проекты <b>в изоляции (vase clos)</b>: закрытые команды, тотальный контроль.</li><li>Уволен из собственной компании в <b>1985</b>, т.к. игнорировал мнение акционеров и партнёров.</li><li><b>Плюсы</b>: сильное видение, требование качества, инновации, конфиденциальность, быстрые решения.</li><li><b>Минусы</b>: постоянное давление, стресс, физическая и моральная усталость, страх, подавленная креативность, текучесть.</li><li><b>Лидер или менеджер?</b> Харизматичный лидер-визионер, но авторитарный менеджер. Стоит перенять требовательность и видение, но не страх.</li></ul>"}
 ]},
 facts:{fr:["Leadership = influencer et fédérer un groupe autour d'un but commun, dans la confiance.","On peut être leader sans être manager : expert, stratège, rénovateur, coach.","Leadership limité dans le temps : dépend des situations, de l'environnement, de la reconnaissance du groupe.","S'effacer au profit d'un collaborateur plus compétent = humilité + leadership situationnel.","Style choisi selon : influence du manager + subordonnés + contexte.","Steve Jobs : autoritaire, directif, contrôle, « culture du oui », renvoyé en 1985."],
        ru:["Лидерство = влиять и объединять группу вокруг общей цели на основе доверия.","Можно быть лидером без должности менеджера: эксперт, стратег, реформатор, коуч.","Лидерство ограничено во времени: зависит от ситуации, среды и признания группой.","Уступить роль более компетентному сотруднику = скромность + ситуационное лидерство.","Стиль выбирают по: влиянию менеджера + подчинённым + контексту.","Стив Джобс: авторитарный, директивный, контроль, «культура да», уволен в 1985."]},
 traps:{fr:["« Le leadership suppose obligatoirement une fonction hiérarchique » → FAUX.","« Le style dépend de la personnalité du manager uniquement » → FAUX.","S'effacer temporairement ≠ perte définitive du statut hiérarchique."],
        ru:["«Лидерство обязательно требует иерархической должности» → НЕВЕРНО.","«Стиль зависит только от характера менеджера» → НЕВЕРНО.","Временно уступить роль ≠ окончательно потерять статус."]}},

{id:"gouv",fr:{t:"Gouvernance d'entreprise",s:"Parties prenantes, conseil d'administration, structure dualiste"},ru:{t:"Корпоративное управление",s:"Стейкхолдеры, совет директоров, двухуровневая структура"},
 body:{
 fr:[
  {h:"Définition",x:"<p>La <mark>gouvernance d'entreprise</mark> est <b>un ensemble de principes et de pratiques qui guident la direction et le contrôle des entreprises</b> : qui décide, qui contrôle, et dans l'intérêt de qui. Ce n'est ni un ensemble de lois, ni un système comptable, ni du marketing.</p>"},
  {h:"Les parties prenantes",x:"<p>Les <mark>parties prenantes</mark> (stakeholders) sont tous ceux qui sont concernés par l'activité de l'entreprise : <b>les employés, les clients, les fournisseurs, les communautés locales et les actionnaires</b> (et aussi banques, État, ONG…).</p>"},
  {h:"Structure moniste : le conseil d'administration",x:"<p>Le <mark>conseil d'administration</mark> <b>supervise la direction de l'entreprise et protège les intérêts des parties prenantes</b>. Il ne gère pas les opérations quotidiennes : c'est le rôle de la direction générale (PDG / DG).</p>"},
  {h:"Structure dualiste",x:"<ul><li>Le <mark>directoire</mark> <b>pilote l'entreprise</b>.</li><li>Le <mark>conseil de surveillance</mark> <b>contrôle l'activité du directoire</b>.</li><li>On sépare ainsi clairement la gestion et le contrôle.</li></ul>"},
  {h:"Le rôle des salariés",x:"<p>Les salariés peuvent agir <b>par l'intermédiaire de représentants du personnel</b> (CSE, administrateurs salariés) et exercer certains droits, comme le <mark>droit d'alerte</mark>.</p><p><b>Exemple :</b> chez Muller-Schuster en 2010, M. Schuster garde la propriété du capital mais confie la direction à un ingénieur. C'est une <b>séparation entre propriété et direction</b>.</p>"}
 ],
 ru:[
  {h:"Определение",x:"<p><mark>Gouvernance d'entreprise</mark> (корпоративное управление) — это <b>совокупность принципов и практик, которые направляют руководство и контроль предприятий</b>: кто решает, кто контролирует и в чьих интересах. Это не свод законов, не бухгалтерия и не маркетинг.</p>"},
  {h:"Заинтересованные стороны",x:"<p><mark>Parties prenantes</mark> (стейкхолдеры) — все, кого касается деятельность компании: <b>сотрудники, клиенты, поставщики, местные сообщества и акционеры</b> (а также банки, государство, НКО…).</p>"},
  {h:"Одноуровневая структура: совет директоров",x:"<p><mark>Conseil d'administration</mark> <b>надзирает за руководством компании и защищает интересы заинтересованных сторон</b>. Он НЕ управляет повседневной работой: это делает генеральный директор (PDG / DG).</p>"},
  {h:"Двухуровневая структура (dualiste)",x:"<ul><li><mark>Directoire</mark> (правление) <b>управляет компанией</b>.</li><li><mark>Conseil de surveillance</mark> (наблюдательный совет) <b>контролирует работу правления</b>.</li><li>Так управление и контроль чётко разделены.</li></ul>"},
  {h:"Роль сотрудников",x:"<p>Сотрудники действуют <b>через представителей персонала</b> (CSE, администраторы от сотрудников) и имеют определённые права, например <mark>droit d'alerte</mark> (право на тревожное уведомление).</p><p><b>Пример:</b> в Muller-Schuster в 2010 г. г-н Шустер сохраняет собственность на капитал, но передаёт руководство инженеру. Это <b>разделение собственности и управления</b>.</p>"}
 ]},
 facts:{fr:["Gouvernance = principes et pratiques qui guident la direction et le contrôle des entreprises.","Parties prenantes : employés, clients, fournisseurs, communautés locales, actionnaires.","Conseil d'administration : supervise la direction, protège les intérêts des parties prenantes.","Structure dualiste : le directoire pilote, le conseil de surveillance contrôle.","Salariés : représentants du personnel + droit d'alerte."],
        ru:["Gouvernance = принципы и практики, направляющие руководство и контроль компаний.","Parties prenantes: сотрудники, клиенты, поставщики, местные сообщества, акционеры.","Conseil d'administration: надзирает за руководством, защищает интересы стейкхолдеров.","Структура dualiste: directoire управляет, conseil de surveillance контролирует.","Сотрудники: представители персонала + droit d'alerte."]},
 traps:{fr:["« Le CA gère les opérations quotidiennes » → FAUX.","« Le directoire contrôle le conseil de surveillance » → FAUX, c'est l'inverse.","« Les parties prenantes = les actionnaires seulement » → FAUX."],
        ru:["«Совет директоров управляет повседневной работой» → НЕВЕРНО.","«Directoire контролирует conseil de surveillance» → НЕВЕРНО, наоборот.","«Стейкхолдеры = только акционеры» → НЕВЕРНО."]}},

{id:"cas",fr:{t:"Études de cas",s:"Muller-Schuster, Lafuma, structures, outils d'analyse"},ru:{t:"Кейсы",s:"Muller-Schuster, Lafuma, структуры, инструменты анализа"},
 body:{
 fr:[
  {h:"Méthode de l'étude de cas",x:"<p>Une <mark>étude de cas</mark> est l'analyse d'une <b>situation réelle d'entreprise</b> pour poser un diagnostic et proposer des solutions argumentées. Elle entraîne à décider comme un manager.</p><ul><li>Lire le texte et les annexes, repérer les acteurs, les chiffres et la chronologie.</li><li>Identifier le problème principal.</li><li>Diagnostic : forces / faiblesses (interne), opportunités / menaces (externe).</li><li>Proposer et justifier des solutions avec des notions du cours.</li></ul><p><b>Entreprise</b> : organisation qui combine des <b>facteurs de production</b> (travail, capital) pour produire des biens ou services vendus sur un marché et créer de la valeur.</p>"},
  {h:"Tôleries Muller-Schuster",x:"<ul><li>1933 : Jean Paul Muller, forgeron. 1954 : Richard Schuster dirige. 1955 : tôlerie. Années 60 : absorption de 2 concurrents. Puis <b>Société Anonyme</b>.</li><li>+60 % du CA à l'étranger (Allemagne 27 %). 200 salariés, politique sociale avancée (intéressement, crèche).</li><li>Problèmes : demande individualisée → petites séries, délais courts, 5 clients perdus en 2009, usine vétuste. Productivité en baisse : <b>6,70 (1988) → 8,3 (1998) → 5,90 € (2009)</b>.</li><li><b>2010</b> : Tony Schuster confie la direction à un <b>ingénieur recruté</b> et garde le capital. C'est le passage d'une <mark>logique entrepreneuriale</mark> (le fondateur-propriétaire décide seul) à une <mark>logique managériale</mark> (dirigeant professionnel, objectifs chiffrés, audit).</li><li>Objectifs 2011 : CA +5 %, productivité +3 %, résultat d'exploitation +5 %. Audit : 1 mois par pièce, 8 000 m parcourus, satisfaction clients 70 %.</li><li><b>Indicateurs de performance</b> possibles : CA, productivité, délais de livraison, satisfaction clients, coûts, absentéisme, turnover.</li><li>Nouvelle organisation : moins de niveaux hiérarchiques, ouvriers polyvalents → <b>structure plus plate</b>, plus réactive, communication plus rapide, plus d'autonomie.</li></ul>"},
  {h:"Les structures",x:"<div class='tbl-wrap'><table class='tbl'><tr><th>Structure</th><th>Principe</th></tr><tr><td>Simple</td><td>Le dirigeant décide de tout (petite entreprise)</td></tr><tr><td>Fonctionnelle</td><td>Découpage par fonctions : production, commercial, finance…</td></tr><tr><td>Divisionnelle</td><td>Découpage par produits, marchés ou zones (ex. 3 pôles Lafuma)</td></tr><tr><td>Matricielle</td><td>Double rattachement : fonction + projet / produit</td></tr><tr><td>Plate / par projets</td><td>Peu de niveaux, équipes autonomes et polyvalentes</td></tr></table></div>"},
  {h:"Groupe Lafuma",x:"<ul><li><b>1930</b> : création par les 3 frères Lafuma. <b>1936</b> : armature du sac à dos. <b>1954</b> : mobilier de camping.</li><li>Croissance externe : <b>Millet</b> (1995), <b>Oxbow</b> (2005), <b>Eider</b> (2008). Eider cédé au coréen <b>K2</b> en 2020.</li><li><b>2013-2014</b> : <b>Calida</b> prend le contrôle (59,92 % en 2014).</li><li><mark>Trois pôles autonomes</mark> : Montagne, Surf, Mobilier → <b>structure divisionnelle</b>.</li><li>CA 2019 : <b>172,6 M€</b>. 1 013 collaborateurs dans 12 pays, 4 usines.</li><li><b>Make or buy</b> (faire ou faire faire) : Made in France <b>25 %</b>, Made in Lafuma <b>13 %</b> (Tunisie, Hongrie), Made for Lafuma <b>62 %</b> (sous-traitance sur cahier des charges).</li><li><b>Distribution multicanale</b> : wholesale (grossistes, 76 %) + direct/retail (23 %) : boutiques, outlets, e-commerce.</li></ul>"},
  {h:"Outils d'analyse",x:"<ul><li><mark>Chaîne de valeur</mark> (Porter) : activités principales (logistique, production, commercialisation, SAV) + activités de soutien (R&D, achats, RH, infrastructure). Lafuma : design → prototype → collection → achat matières → production → logistique → distribution.</li><li><mark>Matrice BCG</mark> : croise le <b>taux de croissance du marché</b> et la <b>part de marché relative</b> → vedettes, vaches à lait, dilemmes, poids morts.</li><li><mark>Bilan</mark> : patrimoine (actif / passif) à une date donnée.</li><li><mark>Compte de résultat</mark> : produits et charges de l'exercice → bénéfice ou perte.</li></ul>"}
 ],
 ru:[
  {h:"Метод кейса",x:"<p><mark>Étude de cas</mark> — анализ <b>реальной ситуации компании</b>, чтобы поставить диагноз и предложить обоснованные решения. Учит принимать решения как менеджер.</p><ul><li>Прочитать текст и приложения, выделить участников, цифры и хронологию.</li><li>Определить главную проблему.</li><li>Диагностика: сильные / слабые стороны (внутри), возможности / угрозы (снаружи).</li><li>Предложить и обосновать решения понятиями из курса.</li></ul><p><b>Предприятие (entreprise)</b>: организация, сочетающая <b>факторы производства</b> (труд, капитал), чтобы производить товары или услуги для рынка и создавать стоимость.</p>"},
  {h:"Tôleries Muller-Schuster",x:"<ul><li>1933: кузнец Жан-Поль Мюллер. 1954: руководит Ришар Шустер. 1955: жестяное производство (tôlerie). 60-е: поглощение 2 конкурентов. Затем <b>АО (Société Anonyme)</b>.</li><li>Более 60% оборота — за рубежом (Германия 27%). 200 сотрудников, развитая социальная политика (участие в прибыли, детский сад).</li><li>Проблемы: индивидуальный спрос → малые серии, короткие сроки, 5 клиентов ушли в 2009, устаревший завод. Падение производительности: <b>6,70 (1988) → 8,3 (1998) → 5,90 € (2009)</b>.</li><li><b>2010</b>: Тони Шустер передаёт руководство <b>нанятому инженеру</b>, но сохраняет капитал. Это переход от <mark>предпринимательской логики</mark> (основатель-собственник решает сам) к <mark>управленческой логике</mark> (профессиональный руководитель, цели в цифрах, аудит).</li><li>Цели на 2011: оборот +5%, производительность +3%, операционный результат +5%. Аудит: 1 месяц на деталь, 8 000 м по линии, удовлетворённость клиентов 70%.</li><li><b>Показатели эффективности</b>: оборот, производительность, сроки поставок, удовлетворённость клиентов, затраты, прогулы, текучесть.</li><li>Новая организация: меньше уровней иерархии, универсальные рабочие → <b>более плоская структура</b>, быстрее реакция и коммуникация, больше автономии.</li></ul>"},
  {h:"Структуры",x:"<div class='tbl-wrap'><table class='tbl'><tr><th>Структура</th><th>Принцип</th></tr><tr><td>Простая (simple)</td><td>Руководитель решает всё (малое предприятие)</td></tr><tr><td>Функциональная</td><td>Деление по функциям: производство, продажи, финансы…</td></tr><tr><td>Дивизиональная</td><td>Деление по продуктам, рынкам или зонам (напр. 3 полюса Lafuma)</td></tr><tr><td>Матричная</td><td>Двойное подчинение: функция + проект / продукт</td></tr><tr><td>Плоская / проектная</td><td>Мало уровней, автономные и универсальные команды</td></tr></table></div>"},
  {h:"Группа Lafuma",x:"<ul><li><b>1930</b>: основана 3 братьями Лафума. <b>1936</b>: каркас рюкзака. <b>1954</b>: кемпинговая мебель.</li><li>Внешний рост: <b>Millet</b> (1995), <b>Oxbow</b> (2005), <b>Eider</b> (2008). Eider продан корейской <b>K2</b> в 2020.</li><li><b>2013–2014</b>: контроль получает <b>Calida</b> (59,92% в 2014).</li><li><mark>Три автономных полюса</mark>: Горы, Сёрф, Мебель → <b>дивизиональная структура</b>.</li><li>Оборот 2019: <b>172,6 млн €</b>. 1 013 сотрудников в 12 странах, 4 завода.</li><li><b>Make or buy</b> (делать самим или покупать): Made in France <b>25%</b>, Made in Lafuma <b>13%</b> (Тунис, Венгрия), Made for Lafuma <b>62%</b> (субподряд по техзаданию).</li><li><b>Многоканальная дистрибуция</b>: wholesale (оптовики, 76%) + direct/retail (23%): бутики, аутлеты, e-commerce.</li></ul>"},
  {h:"Инструменты анализа",x:"<ul><li><mark>Цепочка ценности</mark> (Портер): основные виды деятельности (логистика, производство, продажи, сервис) + вспомогательные (R&D, закупки, HR, инфраструктура). Lafuma: дизайн → прототип → коллекция → закупка сырья → производство → логистика → дистрибуция.</li><li><mark>Матрица BCG</mark>: <b>темп роста рынка</b> × <b>относительная доля рынка</b> → звёзды, дойные коровы, дилеммы, собаки.</li><li><mark>Bilan</mark> (баланс): имущество (актив / пассив) на определённую дату.</li><li><mark>Compte de résultat</mark> (отчёт о прибылях): доходы и расходы за период → прибыль или убыток.</li></ul>"}
 ]},
 facts:{fr:["Logique entrepreneuriale → managériale = séparation propriété / direction (Muller-Schuster 2010).","Productivité Muller-Schuster : 6,70 → 8,3 → 5,90 € (1988-1998-2009).","Lafuma : 3 pôles (Montagne, Surf, Mobilier) = structure divisionnelle.","Made in France 25 %, Made in Lafuma 13 %, Made for Lafuma 62 %.","Wholesale 76 % / direct 23 %. CA 2019 : 172,6 M€.","BCG = croissance du marché × part de marché relative.","Bilan = patrimoine à une date ; compte de résultat = produits − charges de l'exercice."],
        ru:["Предпринимательская → управленческая логика = разделение собственности и руководства (Muller-Schuster 2010).","Производительность Muller-Schuster: 6,70 → 8,3 → 5,90 € (1988-1998-2009).","Lafuma: 3 полюса (Горы, Сёрф, Мебель) = дивизиональная структура.","Made in France 25%, Made in Lafuma 13%, Made for Lafuma 62%.","Wholesale 76% / прямые продажи 23%. Оборот 2019: 172,6 млн €.","BCG = рост рынка × относительная доля рынка.","Bilan = имущество на дату; compte de résultat = доходы − расходы за период."]},
 traps:{fr:["Bilan ≠ compte de résultat : ne pas inverser.","Make or buy = produire soi-même ou sous-traiter (pas « vendre ou acheter »).","Wholesale = distributeurs / grossistes ; retail = vente directe."],
        ru:["Bilan ≠ compte de résultat: не путать.","Make or buy = производить самим или отдать на субподряд (не «продать или купить»).","Wholesale = через дистрибьюторов / оптовиков; retail = прямые продажи."]}}
];

/* QCM: a = index of correct option. id < 100 = TD questions (scan), id > 100 = bonus */
const QS = [
{id:1,t:"podc",a:1,fr:["Ce n'est pas au manager de contrôler les résultats et de mobiliser les hommes.",["Vrai","Faux"],"Faux : contrôler les résultats et mobiliser les hommes sont deux missions centrales du manager (fonctions contrôle et direction)."],ru:["Контролировать результаты и мобилизовать людей — не задача менеджера.",["Верно","Неверно"],"Неверно: контроль результатов и мобилизация людей — ключевые задачи менеджера (функции контроля и руководства)."]},
{id:2,t:"gm",a:0,fr:["Le management peut se décliner sur une dimension stratégique et une dimension opérationnelle.",["Vrai","Faux"],"Vrai : stratégique = long terme (direction générale) ; opérationnel = mise en œuvre concrète (plans d'action)."],ru:["Менеджмент может иметь стратегическое и операционное измерение.",["Верно","Неверно"],"Верно: стратегический = долгий срок (высшее руководство); операционный = конкретная реализация (планы действий)."]},
{id:3,t:"gm",a:0,fr:["Le rôle du manager opérationnel est de mettre en œuvre concrètement les décisions stratégiques à travers des plans d'action.",["Vrai","Faux"],"Vrai : c'est exactement la définition du management opérationnel."],ru:["Роль операционного менеджера — конкретно реализовывать стратегические решения через планы действий.",["Верно","Неверно"],"Верно: это и есть определение операционного менеджмента."]},
{id:4,t:"gm",a:1,fr:["Le management rassemble…",["Des moyens permettant de communiquer","Des techniques permettant de planifier, d'organiser, de diriger et de contrôler les activités d'une entreprise","Des dispositifs permettant de recruter les salariés et de les motiver"],"Définition du cours : techniques pour planifier, organiser, diriger et contrôler (PODC)."],ru:["Менеджмент объединяет…",["Средства для коммуникации","Техники, позволяющие планировать, организовывать, руководить и контролировать деятельность предприятия","Механизмы для найма и мотивации сотрудников"],"Определение из курса: техники для планирования, организации, руководства и контроля (PODC)."]},
{id:5,t:"gm",a:0,fr:["Qu'est-ce que le management stratégique ?",["La création, la mise en place et le suivi d'une stratégie à long terme","La gestion et l'organisation des activités de l'entreprise à court et moyen terme","La gestion des relations avec les clients et les fournisseurs à moyen terme"],"Stratégique = long terme. Le court / moyen terme relève de la gestion et de l'opérationnel."],ru:["Что такое стратегический менеджмент?",["Создание, внедрение и сопровождение долгосрочной стратегии","Управление и организация деятельности на кратко- и среднесрочную перспективу","Управление отношениями с клиентами и поставщиками на среднесрочную перспективу"],"Стратегический = долгий срок. Кратко-/среднесрочное — это gestion и операционный уровень."]},
{id:6,t:"gm",a:0,fr:["Quels sont les deux éléments essentiels que recouvre le terme management ?",["Direction et gestion","Planification et contrôle","Organisation et coordination","Motivation et évaluation"],"Le management recouvre la direction (conduire, décider) et la gestion (utiliser les ressources)."],ru:["Какие два ключевых элемента охватывает термин «менеджмент»?",["Руководство и управление ресурсами (direction et gestion)","Планирование и контроль","Организация и координация","Мотивация и оценка"],"Менеджмент = direction (вести, решать) + gestion (использовать ресурсы)."]},
{id:7,t:"podc",a:1,fr:["Un responsable répartit les tâches, attribue les responsabilités et alloue les ressources nécessaires. Quelle fonction exerce-t-il principalement ?",["La planification","L'organisation","La direction","Le contrôle"],"Répartir les tâches + responsabilités + ressources = organiser."],ru:["Руководитель распределяет задачи, ответственность и необходимые ресурсы. Какую функцию он выполняет?",["Планирование","Организацию","Руководство","Контроль"],"Распределить задачи + ответственность + ресурсы = организация."]},
{id:8,t:"gm",a:1,fr:["Une entreprise dispose de ressources et doit atteindre plusieurs objectifs. Quelle approche correspond le mieux à la définition de la gestion ?",["Maximiser systématiquement les ressources financières disponibles","Utiliser de manière pertinente les ressources disponibles afin d'atteindre les objectifs fixés","Déléguer toutes les décisions aux responsables opérationnels","Contrôler uniquement les résultats financiers de l'entreprise"],"C'est mot pour mot la définition de la gestion."],ru:["У компании есть ресурсы и несколько целей. Какой подход лучше всего соответствует определению gestion?",["Систематически максимизировать финансовые ресурсы","Грамотно использовать имеющиеся ресурсы для достижения поставленных целей","Делегировать все решения операционным руководителям","Контролировать только финансовые результаты"],"Это дословное определение gestion."]},
{id:9,t:"gm",a:2,fr:["La recherche simultanée d'efficacité et d'efficience signifie principalement :",["Atteindre les objectifs, même avec une forte consommation de ressources","Réduire les ressources utilisées, même si les objectifs ne sont pas atteints","Atteindre les objectifs en utilisant les ressources de manière maîtrisée","Remplacer les objectifs qualitatifs par des objectifs financiers"],"Efficacité = atteindre l'objectif ; efficience = avec le moins de ressources. Les deux = objectifs atteints, ressources maîtrisées."],ru:["Одновременное стремление к efficacité и efficience означает:",["Достигать целей, даже тратя много ресурсов","Сокращать ресурсы, даже если цели не достигнуты","Достигать целей при контролируемом использовании ресурсов","Заменить качественные цели финансовыми"],"Efficacité = достичь цели; efficience = с минимумом ресурсов. Вместе = цель достигнута, ресурсы под контролем."]},
{id:10,t:"podc",a:2,fr:["Un manager compare les résultats obtenus aux objectifs prévus et décide d'une action corrective. Quelle séquence décrit correctement son intervention ?",["Direction → organisation → planification","Planification → direction → organisation","Contrôle → correction","Organisation → motivation → planification"],"Comparer résultats / objectifs = contrôle, puis action corrective = correction."],ru:["Менеджер сравнивает результаты с целями и принимает корректирующее действие. Какая последовательность верна?",["Руководство → организация → планирование","Планирование → руководство → организация","Контроль → корректировка","Организация → мотивация → планирование"],"Сравнить результаты с целями = контроль, затем исправление."]},
{id:11,t:"gm",a:2,fr:["Quelle proposition décrit le mieux la relation entre la gestion et le management ?",["Le management exclut la gestion, car il se concentre uniquement sur les relations humaines","La gestion et le management sont deux termes strictement synonymes","Le management englobe la gestion, tout en accordant davantage d'importance au leadership et à la mobilisation des personnes","La gestion concerne la stratégie, tandis que le management concerne uniquement l'administration"],"Le management est plus large : il inclut la gestion + la dimension humaine (leadership, mobilisation)."],ru:["Какое утверждение лучше описывает связь gestion и management?",["Менеджмент исключает gestion, т.к. занимается только отношениями людей","Gestion и management — строгие синонимы","Менеджмент включает gestion, но больше внимания уделяет лидерству и мобилизации людей","Gestion — это стратегия, а менеджмент — только администрирование"],"Менеджмент шире: включает gestion + человеческое измерение (лидерство, мобилизация)."]},
{id:12,t:"gm",a:2,fr:["Une entreprise applique correctement ses procédures, mais ses équipes manquent de motivation et résistent au changement. Quel aspect doit être renforcé en priorité ?",["La gestion matérielle","Le contrôle administratif","Le management","La planification financière"],"Motivation et résistance au changement = dimension humaine → management."],ru:["Компания правильно применяет процедуры, но команды демотивированы и сопротивляются изменениям. Что усилить в первую очередь?",["Материальное управление","Административный контроль","Менеджмент","Финансовое планирование"],"Мотивация и сопротивление изменениям = человеческое измерение → менеджмент."]},
{id:13,t:"gm",a:2,fr:["Laquelle de ces situations relève principalement du management plutôt que de la gestion ?",["Contrôler les dépenses réalisées par un service","Répartir les ressources matérielles entre plusieurs équipes","Mobiliser les collaborateurs autour d'une vision et accompagner le changement","Vérifier l'écart entre les ventes prévues et les ventes réalisées"],"Vision, mobilisation, changement = management. Les autres = gestion (chiffres, ressources)."],ru:["Какая ситуация относится скорее к менеджменту, чем к gestion?",["Контролировать расходы отдела","Распределять материальные ресурсы между командами","Мобилизовать сотрудников вокруг видения и сопровождать изменения","Проверять отклонение плановых продаж от фактических"],"Видение, мобилизация, изменения = менеджмент. Остальное = gestion (цифры, ресурсы)."]},
{id:14,t:"podc",a:2,fr:["Quelle association entre une fonction de gestion et son rôle est incorrecte ?",["Planification : définir les objectifs et prévoir les actions","Organisation : répartir les tâches et les responsabilités","Direction : comparer les résultats aux objectifs","Contrôle : apporter des corrections lorsque cela est nécessaire"],"Piège : comparer les résultats aux objectifs, c'est le contrôle. La direction = animer, motiver, guider."],ru:["Какое сочетание функции и её роли НЕВЕРНО?",["Планирование: определить цели и предусмотреть действия","Организация: распределить задачи и ответственность","Руководство: сравнивать результаты с целями","Контроль: вносить исправления при необходимости"],"Ловушка: сравнение результатов с целями — это контроль. Руководство = вести, мотивировать."]},
{id:15,t:"podc",a:1,fr:["Pourquoi le contrôle ne doit-il pas être compris comme une simple surveillance ?",["Parce qu'il consiste uniquement à sanctionner les responsables","Parce qu'il permet de comparer les résultats aux objectifs et d'engager des actions correctives","Parce qu'il intervient avant la définition des objectifs","Parce qu'il remplace la planification et l'organisation"],"Le contrôle sert à corriger et améliorer, pas seulement à surveiller ou sanctionner."],ru:["Почему контроль нельзя понимать как простой надзор?",["Потому что он состоит только в наказании ответственных","Потому что он позволяет сравнить результаты с целями и запустить корректирующие действия","Потому что он происходит до постановки целей","Потому что он заменяет планирование и организацию"],"Контроль нужен, чтобы исправлять и улучшать, а не только следить или наказывать."]},
{id:16,t:"podc",a:0,fr:["Quelle situation illustre le mieux le rôle complémentaire de la planification et du contrôle ?",["Définir des objectifs, mesurer les résultats obtenus et corriger les écarts","Motiver les collaborateurs sans fixer d'objectifs","Répartir les tâches sans vérifier les résultats","Contrôler les dépenses sans prévoir les ressources nécessaires"],"Planifier (objectifs) → contrôler (mesurer) → corriger : les deux fonctions se complètent."],ru:["Какая ситуация лучше показывает взаимодополняемость планирования и контроля?",["Поставить цели, измерить результаты и исправить отклонения","Мотивировать сотрудников без постановки целей","Распределять задачи, не проверяя результаты","Контролировать расходы, не планируя ресурсы"],"Планировать (цели) → контролировать (измерять) → исправлять: функции дополняют друг друга."]},
