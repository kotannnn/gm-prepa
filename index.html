  const a=norm(txt);
  const f=q.pts.map(p=>p[2].split("|").some(s=>s&&a.includes(norm(s)))?1:0);
  const old=S.tr[key];const same=old&&old.txt===txt;
  S.tr[key]={f,m:same?old.m:f.map(()=>0),txt};
  const sc=tScore(x,i);
  if(!same){rec(key,q.t,sc.p>=.6);if(sc.p>=.6)addXP(15);}
  save();rerenderTQ(i);
  const el=$("#tq-"+i+" .tres");if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function textManual(v){const [i,j]=String(v).split("|").map(Number);const x=curText;if(!x)return;const r=S.tr[tKey(x,i)];if(!r)return;r.m[j]=r.m[j]?0:1;save();rerenderTQ(i)}
let draftT=null;
document.addEventListener("input",e=>{const ta=e.target.closest&&e.target.closest("textarea[data-key]");if(!ta)return;S.ta[ta.dataset.key]=ta.value;clearTimeout(draftT);draftT=setTimeout(save,400)});

/* ================= ANALYSE ================= */
const fmtNum=v=>String(v).replace(".",",");
function topicStats(){
  const tot={};bank().forEach(b=>tot[b.t]=(tot[b.t]||0)+1);PAIRS.forEach(p=>tot[PAIR_T[p.id]]=(tot[PAIR_T[p.id]]||0)+p.items.length);
  TEXTS.forEach(x=>x.q.forEach(q=>tot[q.t]=(tot[q.t]||0)+1));
  const st={};TOPICS.forEach(x=>st[x.id]={n:0,ok:0,seen:0,tot:tot[x.id]||1});
  Object.values(S.h).forEach(r=>{const s=st[r[3]];if(!s)return;s.n+=r[0];s.ok+=r[1];s.seen++});
  TOPICS.forEach(x=>{const s=st[x.id];s.p=s.n?Math.round(s.ok/s.n*100):0;s.cov=Math.min(100,Math.round(s.seen/s.tot*100));s.lvl=s.n<3?0:s.p<50?1:s.p<80?2:3});
  return st;
}
function weakestTopic(){const st=topicStats();const r=TOPICS.filter(x=>st[x.id].lvl===1||st[x.id].lvl===2).sort((a,b)=>st[a.id].p-st[b.id].p)[0];return r?{x:r,p:st[r.id].p}:null}
function itemText(k){
  if(k.startsWith("t:")){const [,xid,i]=k.split(":");const x=TEXTS.find(z=>z.id===xid);const q=x&&x.q[+i];if(!q)return null;return{q:L(x).title+" — "+(S.lang==="ru"?q.ru:q.fr),a:L(q.a),e:""}}
  if(k.startsWith("p:")){const [,sid,i]=k.split(":");const p=PAIRS.find(z=>z.id===sid);const it=p&&p.items[+i];if(!it)return null;const ru=S.lang==="ru";return{q:ru?it[2]:it[0],a:ru?it[3]:it[1],e:""}}
  const b=(itemText.map||(itemText.map=Object.fromEntries(bank().map(z=>[z.k,z]))))[k];if(!b)return null;const d=L(b);return{q:d[0],a:d[1][b.a],e:d[2]};
}
function barsChart(arr,max,ref,refLabel,unit,label){
  if(!arr.length)return `<p class="muted" style="margin:0">${t("noHist")}</p>`;
  const loc=S.lang==="ru"?"ru-RU":"fr-FR";
  const bars=arr.map((e,i)=>{const h=Math.max(2,e.v/max*100);let dt="";try{dt=new Date(e.ts).toLocaleDateString(loc,{day:"2-digit",month:"2-digit"})}catch(x){}
    const lab=`${dt} · ${fmtNum(e.v)}${unit}`;
    return `<div class="cbar" tabindex="0" data-tip="${esc(lab)}" aria-label="${esc(lab)}"><i style="height:${h}%"></i>${i===arr.length-1?`<b style="bottom:calc(${h}% + 4px)">${fmtNum(e.v)}${unit}</b>`:""}</div>`}).join("");
  return `<div class="chart" role="group" aria-label="${esc(label)}"><div class="plot"><span class="ref" style="bottom:${ref/max*100}%"><em>${refLabel}</em></span>${bars}</div></div>`;
}
const ST_ICON=["○","!","◐","✓"];
function viewAnalyse(){CUR=viewAnalyse;
  itemText.map=null;
  const recs=Object.values(S.h),n=recs.reduce((a,r)=>a+r[0],0),ok=recs.reduce((a,r)=>a+r[1],0);
  const N=BANK_N+PAIRS.reduce((a,p)=>a+p.items.length,0)+TEXT_Q_N;
  const head=`<div><h1 class="h2">${t("anaT")}</h1></div>`;
  if(!n){render(`<div class="ana">${head}<div class="result sheet"><span class="mode" style="--tc:var(--c-gouv);padding:0"><span class="ic">${IC.analyse}</span></span><p class="lead" style="margin:0">${t("anaEmpty")}</p><div class="row" style="justify-content:center"><a class="btn pri" href="#marathon">${t("maraGo")} →</a><a class="btn" href="#qcm">${t("startQ")}</a></div></div></div>`);return}
  const st=topicStats(),rank={1:0,2:1,0:2,3:3};
  const rows=TOPICS.slice().sort((a,b)=>rank[st[a.id].lvl]-rank[st[b.id].lvl]||st[a.id].p-st[b.id].p).map(x=>{const s=st[x.id];
    return `<div class="ana-row sheet" style="--tc:var(--c-${x.id})">
      <div class="row" style="gap:8px"><span class="chip">${esc(L(x).t)}</span><span class="pill s${s.lvl}">${ST_ICON[s.lvl]} ${t("st"+s.lvl)}</span></div>
      <span class="pct">${s.n?s.p+"%":"—"}</span>
      <div class="full"><div class="tbar" title="${t("target")}"><i style="width:${s.p}%"></i><span class="goal"></span></div></div>
      <div class="full meta mono">${s.n} ${t("answersW")} · ${s.cov}% ${t("coverage")}</div>
      <p class="full adv">${t("adv"+s.lvl)}</p>
      ${s.lvl<3?`<div class="full row"><button class="btn sm" data-act="goess" data-v="${x.id}">${t("btnEss")}</button><a class="btn sm pri" href="#qcm-${x.id}">${t("btnQcm")} →</a></div>`:""}
    </div>`}).join("");
  const weak=Object.entries(S.h).filter(([k,r])=>r[4]===0||(r[0]>=2&&r[1]/r[0]<.5)).sort((a,b)=>(b[1][0]-b[1][1])-(a[1][0]-a[1][1])||b[1][2]-a[1][2]).slice(0,8)
    .map(([k,r])=>{const it=itemText(k);if(!it)return "";const tp=topic(r[3]);
      return `<div class="rv" style="--tc:var(--c-${r[3]})"><div class="row" style="gap:8px;margin-bottom:6px">${tp?`<span class="chip">${esc(L(tp).t)}</span>`:""}<span class="mono muted" style="font-size:12.5px">${t("missedW")} ${r[0]-r[1]} ${t("outOf")} ${r[0]}${r[4]===0?" · "+t("lastWrong"):""}</span></div><div class="q">${esc(it.q)}</div><div class="a-ok">✓ ${esc(it.a)}</div>${it.e?`<div class="muted" style="margin-top:4px">${esc(it.e)}</div>`:""}</div>`}).join("");
  const sum=t("anaSum").replace("{n}",n).replace("{p}",Math.round(ok/n*100)).replace("{c}",Object.keys(S.h).length).replace("{N}",N);
  render(`<div class="ana">${head}
    <p class="lead" style="margin:-10px 0 0">${sum}</p>
    <section><div class="sec-h"><div><h2 class="h2">${t("toImprove")}</h2><p class="muted" style="margin:6px 0 0">${t("toImproveP")}</p></div></div><div class="ana-list">${rows}</div></section>
    <section><div class="sec-h"><div><h2 class="h2">${t("weakQ")}</h2><p class="muted" style="margin:6px 0 0">${t("weakQP")}</p></div></div><div class="review">${weak||`<p class="muted">${t("noWeak")}</p>`}</div></section>
    <section><div class="sec-h"><h2 class="h2">${t("hist")}</h2></div><div class="charts">
      <div class="sheet chart-card"><h3 class="h3">${t("examsH")}</h3>${barsChart(S.exams,20,10,"10/20","",t("examsH"))}</div>
      <div class="sheet chart-card"><h3 class="h3">${t("marasH")}</h3>${barsChart(S.runs,100,80,"80%","%",t("marasH"))}</div>
    </div></section></div>`);
}

/* ================= EVENTS ================= */
const ACT={
 lang:v=>{S.lang=v;save();shell();if(CUR)CUR();},
 theme:()=>{S.theme=isDark()?"light":"dark";save();applyTheme();themeIcon()},
 podc:v=>{podcOpen=podcOpen===+v?-1:+v;viewHome()},
 reset:(v,b)=>{if(b.dataset.armed){const keep={lang:S.lang,theme:S.theme,orig:S.orig};S=Object.assign({xp:0,res:{},best:{},h:{},exams:[],runs:[],ta:{},tr:{}},keep);M=null;save();toast(t("resetDone"));viewHome();shell()}else{b.dataset.armed="1";b.textContent=t("resetC");b.classList.add("pri")}},
 cmode:v=>{coursMode=v;CUR()},
 startq:v=>{if(location.hash==="#qcm-"+v)startQuiz(v);else location.hash="#qcm-"+v},
 pick:v=>pickQ(v),nextq:()=>nextQ(),retryw:()=>retryWrong(),
 orig:()=>{S.orig=!S.orig;save();CUR()},
 examgo:()=>examStart(),examnew:()=>{E=null;examStart()},
 eans:v=>{E.ans[E.i]=+v;examConfirm=false;renderExam()},
 ego:v=>{v=+v;if(v>=0&&v<E.list.length){E.i=v;examConfirm=false;renderExam()}},
 efinish:()=>{if(examConfirm)examFinish();else{examConfirm=true;renderExam()}},
 cflip:()=>{C.flip=!C.flip;const f=$(".flash");if(f)f.classList.toggle("flip",C.flip)},
 cyes:()=>{const c=C.deck[C.i];rec("c"+CARDS.indexOf(c)+"d",c[0],true);C.known++;addXP(3);C.i++;C.flip=false;renderCards()},
 cno:()=>{const c=C.deck[C.i];rec("c"+CARDS.indexOf(c)+"d",c[0],false);C.again.push(c);C.i++;C.flip=false;renderCards()},
 cfilter:v=>{cardsStart(v);renderCards()},
 cagain:()=>{cardsStart(C.f,C.again);renderCards()},
 ego2:()=>eclairStart(),
 vf:v=>eclairAnswer(v),
 pset:v=>{pairsStart(v);renderPairs()},pl:v=>pairLeft(v),pr:v=>pairRight(v),
 sset:v=>{sortStart(v);renderSort()},sbin:v=>sortPick(v),
 mgo:()=>maraStart(),mpick:v=>maraAnswer(v),mnext:()=>maraNext(),
 mquit:(v,b)=>{if(b.dataset.armed){M=null;viewMarathon()}else{b.dataset.armed="1";b.textContent=t("quitC");b.classList.remove("ghost")}},
 goess:v=>{coursMode="ess";location.hash="#cours-"+v},
 tcheck:v=>textCheck(v),tman:v=>textManual(v),
 totext:()=>{const el=$("#tx-text");if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset.v,b)}});
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea")return;
  const h=(location.hash||"").slice(1);
  if(h.startsWith("qcm-")&&Q&&Q.i<Q.list.length){
    const ord=Q.order[Q.i];const k=parseInt(e.key,10);
    if(Q.picked===null&&k>=1&&k<=ord.length){e.preventDefault();pickQ(ord[k-1])}
    else if(Q.picked!==null&&e.key==="Enter"){e.preventDefault();nextQ()}
  }else if(h==="marathon"&&M&&!M.end){
    const ord=M.order[M.i];const k=parseInt(e.key,10);
    if(M.picked===null&&k>=1&&k<=ord.length){e.preventDefault();maraAnswer(ord[k-1])}
    else if(M.picked!==null&&e.key==="Enter"){e.preventDefault();maraNext()}
  }else if(h==="examen"&&E&&!E.done){
    const ord=E.order[E.i];const k=parseInt(e.key,10);
    if(k>=1&&k<=ord.length){E.ans[E.i]=ord[k-1];examConfirm=false;renderExam()}
    else if(e.key==="ArrowRight"&&E.i<E.list.length-1){E.i++;renderExam()}
    else if(e.key==="ArrowLeft"&&E.i>0){E.i--;renderExam()}
  }else if(h==="eclair"&&T&&T.run){
    if(e.key==="ArrowLeft"){e.preventDefault();eclairAnswer(1)}else if(e.key==="ArrowRight"){e.preventDefault();eclairAnswer(0)}
  }else if(h==="cartes"&&C&&C.i<C.deck.length&&(e.key===" "||e.key==="Enter")&&tag!=="button"){e.preventDefault();ACT.cflip()}
});
if(window.matchMedia){try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",themeIcon)}catch(e){}}
window.addEventListener("hashchange",route);
applyTheme();route();
</script>
